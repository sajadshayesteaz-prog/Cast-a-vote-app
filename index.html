}

  --line:#1E3B32; --line-soft:#173028;

  --teal:#14B8A6; --petrol:#0F766E;
  --turq:#22D3EE; --turq-bright:#67E8F9;
  --lapis:#3B82F6; --indigo:#6366F1;
  --yellow:#FDE047; --amber:#FBBF24;
  --red:#F87171; --red-deep:#EF4444; --red-soft:#FCA5A5;
  --wash-green:#0A2E23; --wash-teal:#0B2E2B; --wash-turq:#0A2A36;
  --wash-indigo:#1A1E3E; --wash-yellow:#2C2413; --wash-red:#311615;
  --grad-primary:linear-gradient(135deg,#059669 0%,#10B981 45%,#6EE7B7 100%);
  --grad-good:linear-gradient(135deg,#14B8A6 0%,#34D399 50%,#A7F3D0 100%);
  --grad-cool:linear-gradient(135deg,#6366F1 0%,#3B82F6 40%,#22D3EE 100%);
  --grad-bad:linear-gradient(135deg,#DC2626 0%,#F87171 55%,#FCA5A5 100%);
  --grad-warn:linear-gradient(135deg,#FBBF24 0%,#FDE047 100%);
  --grad-soft:linear-gradient(140deg,#0C2C22 0%,#0B2733 52%,#161B38 100%);
  --grad-fab:linear-gradient(140deg,#059669 0%,#34D399 40%,#22D3EE 100%);

  --shadow-glow:0 12px 36px -12px rgba(52,211,153,.45);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:8px}
/* One geometry for the whole icon set. Everything else only sets a size. */
.lu{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* small glyphs carry a little more weight, large ones a little less, so the
   apparent thickness stays even from a 14px chip to a 40px badge */
.detail-h svg.lu,.grip svg.lu,.ex svg.lu,.iconbtn.sm svg.lu{stroke-width:2.3}
.ichip svg.lu,.btn svg.lu,.tab svg.lu{stroke-width:2.1}
.dot svg.lu,.gl-ic svg.lu,.law-ic svg.lu,.idea-ic svg.lu,
.sc-ic svg.lu,.tac-ic svg.lu,.loop-s svg.lu{stroke-width:1.85}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ── living background ── */
/* the blur sits here, over the whole layer: one pass instead of one per blob */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:var(--ground);filter:blur(34px)}
.bg i{position:absolute;display:block;border-radius:50%;opacity:.95;will-change:transform,filter}
/* each blob holds its colour flat to a fifth of its radius before falling off,
   which is what stops a big blur from washing the whole thing out. Two clocks
   run on each: one for where it is, one for what colour it is, on lengths that
   do not divide into each other — so the pair never comes back round together. */
.bg i:nth-child(1){width:80vw;height:80vw;left:-24vw;top:-20vw;
  background:radial-gradient(circle,var(--green) 0%,var(--green) 22%,transparent 72%);
  animation:drift1 54s ease-in-out infinite, tint1 71s ease-in-out infinite}
.bg i:nth-child(2){width:70vw;height:70vw;right:-22vw;top:10vh;
  background:radial-gradient(circle,var(--turq) 0%,var(--turq) 20%,transparent 72%);
  animation:drift2 63s ease-in-out infinite, tint2 83s ease-in-out infinite}
.bg i:nth-child(3){width:66vw;height:66vw;left:0;bottom:-18vh;
  background:radial-gradient(circle,var(--indigo) 0%,var(--indigo) 20%,transparent 72%);
  animation:drift3 58s ease-in-out infinite, tint3 77s ease-in-out infinite}
.bg i:nth-child(4){width:48vw;height:48vw;right:0;bottom:2vh;
  background:radial-gradient(circle,var(--yellow) 0%,var(--yellow) 18%,transparent 70%);
  animation:drift4 69s ease-in-out infinite, tint4 59s ease-in-out infinite}
.bg i:nth-child(5){width:56vw;height:56vw;left:22vw;top:32vh;
  background:radial-gradient(circle,var(--lapis) 0%,var(--lapis) 16%,transparent 70%);
  animation:drift2 47s ease-in-out infinite reverse, tint5 67s ease-in-out infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg i{opacity:.62}}
:root[data-theme="dark"] .bg i{opacity:.62}
/* three stops rather than two: a blob that only goes out and back reads as a
   pendulum, and the eye locks on to a pendulum */
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}
  34%{transform:translate(11vw,8vh) scale(1.22)}
  67%{transform:translate(4vw,16vh) scale(.9)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.04)}
  36%{transform:translate(-12vw,10vh) scale(.88)}
  71%{transform:translate(-5vw,-7vh) scale(1.18)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(.95)}
  31%{transform:translate(9vw,-12vh) scale(1.24)}
  64%{transform:translate(-6vw,-4vh) scale(1.02)}}
@keyframes drift4{0%,100%{transform:translate(0,0) scale(1.1)}
  40%{transform:translate(-8vw,-13vh) scale(.86)}
  73%{transform:translate(7vw,-5vh) scale(1.16)}}
/* the colour turn: small enough to land on a neighbour in the palette, never
   past it. Saturation breathes with it so the shift does not read as a filter */
@keyframes tint1{0%,100%{filter:hue-rotate(0deg) saturate(1)}
  50%{filter:hue-rotate(16deg) saturate(1.16)}}
@keyframes tint2{0%,100%{filter:hue-rotate(0deg) saturate(1.08)}
  50%{filter:hue-rotate(-14deg) saturate(.92)}}
@keyframes tint3{0%,100%{filter:hue-rotate(0deg) saturate(1)}
  50%{filter:hue-rotate(18deg) saturate(1.14)}}
@keyframes tint4{0%,100%{filter:hue-rotate(0deg) saturate(1.05)}
  50%{filter:hue-rotate(-12deg) saturate(1.2)}}
@keyframes tint5{0%,100%{filter:hue-rotate(0deg) saturate(.96)}
  50%{filter:hue-rotate(15deg) saturate(1.18)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .bg i{animation:none!important}
}

.app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative}
.screen{padding:0 16px calc(118px + env(safe-area-inset-bottom));display:none}
.screen.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── masthead ── */
.mast{padding:26px 0 16px}
.mast h1{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.02;margin:0;
  letter-spacing:-.03em;text-wrap:balance}
.mast h1 .g{background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
.mast .sub{color:var(--ink-2);font-size:13.5px;margin:8px 0 0;line-height:1.5}

/* ── hero ── */
.meter{border-radius:var(--r);padding:20px;background:var(--grad-primary);color:#fff;
  box-shadow:var(--shadow-glow);position:relative;overflow:hidden}
.meter::after{content:"";position:absolute;right:-58px;top:-64px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3) 0%,transparent 68%)}
.meter::before{content:"";position:absolute;left:-42px;bottom:-72px;width:158px;height:158px;border-radius:50%;
  background:radial-gradient(circle,rgba(250,204,21,.34) 0%,transparent 66%)}
.meter-row{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.meter .big{font-family:var(--f-fun);font-weight:600;font-size:46px;line-height:.92;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.meter .big small{font-size:18px;opacity:.75;font-weight:500}
.meter .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  opacity:.85;margin-top:7px}
.meter .divider{width:1px;align-self:stretch;background:rgba(255,255,255,.3)}
.meter .mult{font-size:12.5px;opacity:.92;margin-top:4px;font-weight:600}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec h2{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin:0}
.sec .note{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.05em}

/* ── alerts ── */
.alert{border-radius:var(--r-sm);padding:14px 16px;margin:16px 0 0;border:1.5px solid transparent}
.alert.bad{background:var(--wash-red);border-color:var(--red)}
.alert.calm{background:var(--wash-turq);border-color:var(--turq)}
.alert.good{background:var(--wash-green);border-color:var(--green)}
.alert-h{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.alert-h svg{width:20px;height:20px;flex:none;fill:none}
.alert b{font-family:var(--f-fun);font-weight:600;font-size:17px;letter-spacing:-.01em}
.alert.bad .alert-h{color:var(--red-deep)} .alert.calm .alert-h{color:var(--turq)} .alert.good .alert-h{color:var(--green-deep)}
.alert p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}

/* ── habit card ── */
.card{background:linear-gradient(165deg,
    color-mix(in srgb, var(--hc, var(--green)) 10%, var(--surface)) 0%,
    color-mix(in srgb, var(--hc, var(--green)) 42%, var(--surface)) 100%);
  border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow-s);
  border:1px solid color-mix(in srgb, var(--hc, var(--green)) 36%, var(--line-soft));overflow:hidden}
.card-main{display:flex;gap:14px;padding:15px 16px 13px;align-items:flex-start}

.stamp{flex:none;width:50px;height:50px;border-radius:17px;border:2.5px solid var(--line);
  background:var(--surface-2);display:grid;place-items:center;cursor:pointer;position:relative;
  transition:transform .13s cubic-bezier(.3,1.6,.6,1),box-shadow .2s,border-color .2s,background .2s;padding:0}
.stamp:active{transform:scale(.88)}
.stamp svg{width:24px;height:24px;position:relative;z-index:1}
.stamp .ic{stroke:var(--muted);stroke-width:3;opacity:0}
.stamp[data-s] .ic{opacity:1}
.stamp[data-s="done"],.stamp[data-s="clean"]{border-color:transparent;background:var(--grad-good);
  box-shadow:0 7px 18px -6px color-mix(in srgb,var(--green) 75%,transparent)}
.stamp[data-s="done"] .ic,.stamp[data-s="clean"] .ic{stroke:#fff}
.stamp[data-s="two"]{border-color:var(--green);background:var(--wash-green)}
.stamp[data-s="two"] .ic{stroke:var(--green-deep)}
.stamp[data-s="miss"],.stamp[data-s="slip"]{border-color:transparent;background:var(--grad-bad);
  box-shadow:0 7px 18px -6px color-mix(in srgb,var(--red) 70%,transparent)}
.stamp[data-s="miss"] .ic,.stamp[data-s="slip"] .ic{stroke:#fff}
.stamp .cnt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-fun);
  font-weight:600;font-size:16px;color:var(--ink);z-index:2;letter-spacing:-.02em}
.stamp[data-s="done"] .cnt,.stamp[data-s="clean"] .cnt{color:#fff}
.stamp .cnt.two{color:var(--green-deep);font-size:14px}

.card-body{flex:1;min-width:0}
.card-name{font-family:var(--f-disp);font-size:17.5px;font-weight:700;line-height:1.22;margin:3px 0 0;
  letter-spacing:-.02em;overflow-wrap:anywhere}
.ident{font-size:13px;color:var(--green-deep);margin:6px 0 0;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.dline{font-size:12.5px;color:var(--muted);margin:5px 0 0;line-height:1.48;overflow-wrap:anywhere}
/* the card tint is strong enough now that --muted would sink into it */
.card .dline,.mini .dline,.card .detail-r dd,.mini .detail-r dd{color:var(--ink-2)}
.dline b{font-weight:700;color:var(--ink-2)}
.card-side{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.streak{font-family:var(--f-fun);font-weight:600;font-size:27px;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;background:var(--grad-good);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.streak.zero{background:none;color:var(--muted)}
.streak-l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.chain{display:flex;gap:3px;padding:0 16px 12px;margin-left:64px}
.chain i{flex:1;max-width:13px;aspect-ratio:1;border-radius:4px;background:var(--grid-empty);display:block}
.chain i[data-s="done"],.chain i[data-s="clean"]{background:var(--grad-good)}
.chain i[data-s="two"]{background:var(--green);opacity:.45}
.chain i[data-s="slip"],.chain i[data-s="miss"]{background:var(--grad-bad)}
.chain i[data-s="off"]{background:var(--grid-off)}
.chain i[data-today]{outline:2px solid var(--green-deep);outline-offset:1.5px}

/* icon-only chip row */
.toggles{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ichip{width:30px;height:30px;flex:none;border:0;border-radius:10px;background:var(--surface-2);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background .16s,color .16s,transform .12s}
.ichip:active{transform:scale(.9)}
.ichip svg{width:16px;height:16px;fill:none}
.ichip:hover{background:var(--wash-green);color:var(--green-deep)}
.ichip[aria-pressed="true"]{background:var(--grad-good);color:#fff}
/* giving in is a failure, so it carries the shared red the moment it is offered,
   not just once it is chosen — the same red a missed day gets on a card */
.seg button[data-out="gave"]{color:var(--red-deep)}
.seg button[data-out="gave"][aria-pressed="true"]{background:var(--grad-bad);color:#fff}
/* NB: never name this `.urge` — that class is the urge log card further down */
.ichip.hot{background:var(--wash-red);color:var(--red-deep)}
.ichip.hot:hover{background:var(--grad-bad);color:#fff}
.ichip.meas:hover{background:var(--wash-turq);color:var(--turq)}
.chip{background:var(--surface-2);border:0;border-radius:999px;padding:4px 11px;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px}
.chip.slot{background:var(--wash-turq);color:var(--turq)}
.chip.goal{background:var(--wash-green);color:var(--green-deep)}
.chip.warnc{background:var(--wash-red);color:var(--red-deep)}

.detail{background:transparent;border-top:1px solid var(--line-soft);padding:14px 16px}
.detail-g{margin-bottom:13px}
.detail-g:last-child{margin-bottom:0}
.detail-h{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--green-deep);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.detail-h svg{width:14px;height:14px;fill:none;flex:none}
.detail-h::after{content:"";flex:1;height:1px;background:var(--line)}
.detail-r{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;font-size:13px;margin:0 0 5px}
.detail-r dt{font-family:var(--f-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding-top:3px}
.detail-r dd{margin:0;line-height:1.45;color:var(--ink-2);overflow-wrap:anywhere}
.scaff{margin-top:12px;display:flex;align-items:center;gap:9px}
.scaff-bar{flex:1;height:6px;border-radius:999px;background:var(--grid-empty);overflow:hidden}
.scaff-bar i{display:block;height:100%;background:var(--grad-good);border-radius:999px}
.scaff-t{font-family:var(--f-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}

/* ── FAB ── */
.fab{position:fixed;left:50%;transform:translateX(calc(-50% + 168px));
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:60px;height:60px;border-radius:50%;
  border:0;background:var(--grad-fab);color:#fff;cursor:pointer;display:grid;place-items:center;
  box-shadow:var(--shadow-fab);transition:transform .16s cubic-bezier(.3,1.5,.6,1)}
.fab:active{transform:translateX(calc(-50% + 168px)) scale(.9)}
.fab svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
@media(max-width:460px){
  .fab{left:auto;right:18px;transform:none}
  .fab:active{transform:scale(.9)}
}

/* ── compact habit card ── */
.mini{background:linear-gradient(165deg,
    color-mix(in srgb, var(--hc, var(--green)) 10%, var(--surface)) 0%,
    color-mix(in srgb, var(--hc, var(--green)) 40%, var(--surface)) 100%);
  border-radius:var(--r-sm);border:1px solid color-mix(in srgb, var(--hc, var(--green)) 34%, var(--line-soft));
  box-shadow:var(--shadow-s);margin-bottom:9px;overflow:hidden}
.panel.hab{background:linear-gradient(165deg,
    color-mix(in srgb, var(--hc, var(--green)) 9%, var(--surface)) 0%,
    color-mix(in srgb, var(--hc, var(--green)) 38%, var(--surface)) 100%);
  border-color:color-mix(in srgb, var(--hc, var(--green)) 34%, var(--line-soft))}
.panel.hab .chartwrap{background:color-mix(in srgb, var(--surface) 72%, transparent)}

/* accordion sections in the editor */
.law.acc{padding:0;overflow:hidden}
.acc-h{width:100%;background:none;border:0;padding:14px 15px;display:flex;align-items:center;gap:11px;
  cursor:pointer;text-align:left;font-family:var(--f-ui)}
.acc-h .chev{margin-left:auto;flex:none;color:var(--muted);transition:transform .22s}
.acc-h .chev svg{width:15px;height:15px;display:block}
.law.acc[data-open="true"] .acc-h .chev{transform:rotate(180deg)}
.acc-sum{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.05em;display:block;
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.acc-b{padding:0 15px 15px}
.acc-b .law-d{margin-top:0}
.dotmark{width:7px;height:7px;border-radius:50%;background:var(--hg,var(--grad-good));flex:none;
  display:inline-block;margin-left:6px;vertical-align:middle}
.mini-r{display:flex;align-items:center;gap:12px;padding:12px 13px}
.dot{width:44px;height:44px;border-radius:15px;flex:none;display:grid;place-items:center;position:relative;
  overflow:hidden}
.dot.build{background:var(--grad-good);color:#fff}
.dot.break{background:var(--grad-bad);color:#fff}
.dot::after{content:"";position:absolute;right:-12px;top:-14px;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.34) 0%,transparent 70%)}
.dot svg{width:23px;height:23px;fill:none;position:relative;z-index:1}
.mini-b{flex:1;min-width:0}
.mini-n{font-family:var(--f-disp);font-weight:700;font-size:15.5px;line-height:1.25;letter-spacing:-.015em;
  overflow-wrap:anywhere}
.mini-m{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:4px;
  display:flex;gap:8px;flex-wrap:wrap}
.mini-m b{color:var(--green-deep)}
.iconbtn{width:34px;height:34px;flex:none;border-radius:11px;border:0;background:var(--surface-2);
  cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:background .16s,color .16s}
.iconbtn:hover{background:var(--wash-green);color:var(--green-deep)}
.iconbtn svg{width:17px;height:17px;fill:none}
.iconbtn[aria-pressed="true"]{background:var(--wash-green);color:var(--green-deep)}
.iconbtn.sm{width:28px;height:28px;border-radius:9px}
.iconbtn.sm svg{width:14px;height:14px}
.iconbtn.danger:hover{background:var(--wash-red);color:var(--red-deep)}

/* ── buttons ── */
.btn{border:0;background:var(--surface);border-radius:999px;padding:11px 19px;font-size:14px;font-weight:700;
  cursor:pointer;box-shadow:var(--shadow-s);transition:transform .13s,box-shadow .2s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;font-family:var(--f-ui)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;fill:none}
.btn.primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-glow)}
.btn.cool{background:var(--grad-cool);color:#fff}
.btn.ghost{background:var(--surface-2);box-shadow:none;color:var(--ink-2)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red-deep)}
.btn.wide{width:100%}
.btn.sm{padding:8px 14px;font-size:12.5px}

.empty{border-radius:var(--r);padding:30px 22px;text-align:center;background:var(--grad-soft);
  border:1.5px dashed var(--line)}
.empty .q{font-family:var(--f-fun);font-size:21px;font-weight:600;color:var(--ink);margin-bottom:10px;
  line-height:1.24;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0 0 4px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}

/* ── start module ── */
/* the intention reads as one sentence; the blanks are visible gaps, not fields */
.intent{font-family:var(--f-fun);font-size:17.5px;line-height:1.55;font-weight:500;
  margin:0 0 14px;letter-spacing:-.01em;text-wrap:pretty;color:var(--ink)}
.intent b{font-weight:700;color:var(--ht,var(--green-deep))}
.intent i.blank{font-style:normal;font-weight:600;color:var(--muted);
  border-bottom:2px dotted var(--line);padding-bottom:1px}
.fcard{margin-bottom:14px}
.fcard .btn.primary{background:var(--hg,var(--grad-primary))}
.fcard .big-go{padding:16px 22px;font-size:16.5px;gap:10px}
.fcard .big-go svg{width:21px;height:21px}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow .btn{flex:1 1 auto}
.fcard .frow{margin-top:9px}
/* the deadline block: one row per checkpoint, tappable */
.ckline{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.ckline:first-of-type{border-top:0}
.ckline .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.ckline .t{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.ckbox{width:26px;height:26px;border-radius:9px;flex:none;border:1.5px solid var(--line);
  background:var(--ground);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted)}
.ckbox svg{width:15px;height:15px;fill:none}
.ckbox[aria-pressed="true"]{background:var(--grad-good);border-color:transparent;color:#fff}
.ckline.past .d{color:var(--red-deep)}
/* the later list: what pulled you away, kept until curiosity time */
.lrow{display:flex;align-items:flex-start;gap:11px;background:var(--surface-2);border-radius:var(--r-sm);
  padding:11px 13px;margin-bottom:8px;border:1px solid var(--line-soft)}
/* on the open screen this block sat straight on the drifting background, where
   muted type has nothing to hold on to; inside a panel it has a surface */
.panel.later .lhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.panel.later .lhead .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.panel.later .lrow:last-child{margin-bottom:0}
.lrow.done{opacity:.55}
.lrow.done .ltext{text-decoration:line-through}
.lrow .li{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--wash-turq);color:var(--turq)}
.lrow .li svg{width:17px;height:17px;fill:none}
.lrow .b{flex:1;min-width:0}
/* NOT .x — that is the sheet's 32px close button, and it was squeezing every
   row into a one-letter-wide column */
.lrow .ltext{display:block;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;color:var(--ink)}
.lrow .lmeta{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-top:3px;display:block}
/* the delay sheet is deliberately warm: no red, no broken chain, no scoring */
.forgive{background:var(--grad-soft);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:16px 17px;margin-bottom:16px}
.forgive p{margin:0;font-family:var(--f-fun);font-size:16.5px;line-height:1.5;font-weight:500;
  letter-spacing:-.01em;text-wrap:pretty}
.forgive .who{display:flex;align-items:center;gap:9px;margin-bottom:9px;color:var(--turq)}
.forgive .who svg{width:19px;height:19px;fill:none}
.forgive .who span{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chipset button{border:1.5px solid var(--line);background:var(--ground);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  font-family:inherit;transition:background .16s,border-color .16s,color .16s}
.chipset button[aria-pressed="true"]{background:var(--wash-turq);border-color:var(--turq);color:var(--turq)}
.chipset button{display:inline-flex;align-items:center;gap:7px}
.chipset button svg{width:15px;height:15px;fill:none}
/* how-to steps in the guide, same furniture as a tactic card */
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding-inline-start:36px;margin-bottom:11px;font-size:13px;line-height:1.55;
  color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;inset-inline-start:0;top:-1px;
  width:25px;height:25px;border-radius:9px;display:grid;place-items:center;background:var(--lg,var(--grad-primary));
  color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:700}
/* .tac b is a block-level tactic title; inside a step it is just emphasis */
.steps li b{display:inline;color:var(--ink);font-weight:700;font-size:inherit;
  font-family:inherit;margin:0;letter-spacing:inherit}

/* ── tabs ── */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom)}
/* each tab keeps a floor width and grows to fill the row. With room for all of
   them nothing scrolls; below that the strip slides sideways rather than
   squeezing the label onto two lines. */
.tabs-in{max-width:460px;margin:0 auto;width:100%;display:flex;
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:56px;background:none;border:0;padding:9px 3px 10px;cursor:pointer;
  display:flex;flex-direction:column;white-space:nowrap;
  align-items:center;gap:4px;color:var(--muted);transition:color .18s}
.tab svg{width:23px;height:23px;fill:none}
.tab span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase}
.tab.on{color:var(--green-deep)}
.tab.on svg{stroke:url(#tabGrad)}

/* ── sheet ── */
.veil{position:fixed;inset:0;background:rgba(2,14,10,.58);z-index:50;display:none;align-items:flex-end;
  justify-content:center;backdrop-filter:blur(3px)}
.veil.on{display:flex}
.sheet{background:var(--ground);width:100%;max-width:460px;max-height:93dvh;overflow-y:auto;
  border-radius:28px 28px 0 0;animation:rise .27s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
.sheet-top{position:sticky;top:0;background:var(--ground);padding:16px 18px 13px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;z-index:3;border-bottom:1px solid var(--line-soft)}
.sheet-top h3{font-family:var(--f-fun);font-size:21px;font-weight:600;margin:0;line-height:1.2;letter-spacing:-.01em}
.sheet-in{padding:16px 18px 30px}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:9px auto 0}
.x{background:var(--surface-2);border:0;cursor:pointer;color:var(--muted);width:32px;height:32px;
  border-radius:999px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--wash-red);color:var(--red-deep)}
.x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* ── forms ── */
.law{border-radius:var(--r-sm);background:var(--surface);padding:15px;margin-bottom:12px;
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s)}
.law-h{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.law-ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--grad-good);color:#fff}
.law-ic svg{width:18px;height:18px;fill:none}
.law.inv .law-ic{background:var(--grad-bad)}
.law.rhythm .law-ic{background:var(--grad-cool)}
.law-tt{min-width:0}
.law-n{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block}
.law-t{font-family:var(--f-fun);font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.law-d{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.5}

.f{margin-bottom:13px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;background:var(--ground);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 13px;font-size:14px;transition:border-color .16s,box-shadow .16s;
  font-family:var(--f-ui)}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--green);outline:none;
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--green) 18%,transparent)}
.f textarea{resize:vertical;min-height:62px;line-height:1.5}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.75}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.f .hint em{font-style:normal;font-weight:700;color:var(--ink-2)}
.f2{display:flex;gap:9px}
.f2 > .f{flex:1;min-width:0}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:999px;padding:9px 6px;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--muted);transition:background .18s,color .18s;font-family:var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-s)}
.seg button[data-kind="break"][aria-pressed="true"]{background:var(--grad-bad);color:#fff}
.seg.sm button{padding:7px 5px;font-size:12px}

.days{display:flex;gap:5px}
.days button{flex:1;aspect-ratio:1;border:1.5px solid var(--line);background:var(--ground);border-radius:12px;
  cursor:pointer;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--muted);
  transition:background .16s,color .16s,border-color .16s;padding:0}
.days button[aria-pressed="true"]{background:var(--grad-good);border-color:transparent;color:#fff}
.days.mini button{border-radius:9px;font-size:11px}

.slotcard{background:var(--ground);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
.slotcard-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.slotcard-h .sum{flex:1;min-width:0;font-family:var(--f-mono);font-size:11px;color:var(--green-deep);letter-spacing:.04em}
.slot-f{display:flex;gap:7px;margin-bottom:9px}
.slot-f .f{margin:0;flex:1;min-width:0}
.slot-f .f label{font-size:8.5px;margin-bottom:4px}
.slot-f input{padding:8px 10px;font-size:13px}

/* ── every mark on a habit card takes the habit's own colour ──
   --ht is the readable text tone: the dark end on light grounds, the light end on dark */
.card,.mini,.panel.hab,.sc-row.hab,.urge,.tmr-wrap{--ht:var(--hc)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card,
  :root:not([data-theme="light"]) .mini,
  :root:not([data-theme="light"]) .panel.hab,
  :root:not([data-theme="light"]) .sc-row.hab,
  :root:not([data-theme="light"]) .urge,
  :root:not([data-theme="light"]) .tmr-wrap{--ht:var(--hl)}
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .mini,
:root[data-theme="dark"] .panel.hab,:root[data-theme="dark"] .sc-row.hab,
:root[data-theme="dark"] .urge,:root[data-theme="dark"] .tmr-wrap{--ht:var(--hl)}

.card .ident,.mini .ident{color:var(--ht)}
.card .dline b,.mini .dline b{color:var(--ht)}
.card .streak,.mini .mini-m b{background:var(--hg);-webkit-background-clip:text;background-clip:text;color:transparent}
.mini .mini-m b{background:none;color:var(--ht)}
.card .streak.zero{background:none;color:var(--muted)}
.card .streak-l,.card .card-side{color:var(--muted)}
.card .detail-h,.panel.hab .detail-h{color:var(--ht)}
.card .scaff-bar i{background:var(--hg)}
.card .chip.slot,.card .chip.goal,.mini .chip.slot,.mini .chip.goal,
.panel.hab .chip.goal,.sc-row.hab .tag{
  background:color-mix(in srgb, var(--hc) 15%, var(--surface));color:var(--ht)}
.sc-row.hab .tag{background:none}
.card .ichip,.panel.hab .ichip{background:color-mix(in srgb, var(--hc) 13%, var(--surface));color:var(--ht)}
.card .ichip:hover,.panel.hab .ichip:hover{background:color-mix(in srgb, var(--hc) 26%, var(--surface))}
.card .ichip[aria-pressed="true"],.panel.hab .ichip[aria-pressed="true"]{background:var(--hg);color:#fff}
.card .stamp[data-s="done"],.card .stamp[data-s="clean"]{background:var(--hg);
  box-shadow:0 7px 18px -6px color-mix(in srgb, var(--hc) 65%, transparent)}
.card .stamp[data-s="two"]{border-color:var(--hc);background:color-mix(in srgb, var(--hc) 15%, var(--surface))}
.card .stamp[data-s="two"] .ic{stroke:var(--ht)}
.card .stamp .cnt{color:var(--ht)}
.card .stamp .cnt.two{color:var(--ht)}
.card .stamp{border-color:color-mix(in srgb, var(--hc) 28%, var(--line))}
.card .chain i[data-s="done"],.card .chain i[data-s="clean"],
.panel.hab .mgrid i[data-s="done"],.panel.hab .mgrid i[data-s="clean"]{background:var(--hg)}
.card .chain i[data-s="two"],.panel.hab .mgrid i[data-s="two"]{background:var(--hc);opacity:.45}
.card .chain i[data-today]{outline-color:var(--hc)}
.panel.hab h3{color:var(--ht)}
.panel.hab .mswitch button[aria-pressed="true"]{background:var(--hg);color:#fff}
.panel.hab .mswitch button{background:color-mix(in srgb, var(--hc) 12%, var(--surface));color:var(--ht)}
/* Failure keeps the shared red — it must never blend into a habit's own palette.
   The ring stays, though: a stamped cross is the same object as a stamped tick,
   and dropping its border made the two read as different shapes. */
.card .stamp[data-s="miss"],.card .stamp[data-s="slip"]{background:var(--grad-bad)}
.card .chain i[data-s="miss"],.card .chain i[data-s="slip"],
.panel.hab .mgrid i[data-s="miss"],.panel.hab .mgrid i[data-s="slip"]{background:var(--grad-bad)}
.card .ichip.hot{background:var(--wash-red);color:var(--red-deep)}
.card .ichip.hot:hover{background:var(--grad-bad);color:#fff}

/* identities */
.identrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.identchip{display:inline-flex;align-items:center;gap:7px;background:var(--grad-good);color:#fff;
  border:0;border-radius:999px;padding:7px 8px 7px 14px;font-size:13px;font-weight:700;
  font-family:var(--f-ui);max-width:100%}
.identchip button{background:rgba(255,255,255,.26);border:0;color:#fff;width:20px;height:20px;
  border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;padding:0;flex:none}
.identchip button:hover{background:rgba(255,255,255,.45)}
.identchip.pick{background:var(--surface-2);color:var(--ink-2);cursor:pointer;padding:7px 14px;
  font-weight:600;transition:background .15s,color .15s}
.identchip.pick:hover{background:var(--grad-good);color:#fff}
.identchip .n{font-family:var(--f-mono);font-size:9.5px;opacity:.7;background:rgba(0,0,0,.08);
  border-radius:999px;padding:2px 7px;white-space:nowrap}
.identchip.pick.orphan{box-shadow:inset 0 0 0 1.5px var(--amber)}
.identchip.pick.orphan .n{background:var(--wash-yellow);color:var(--amber);opacity:1}
.identchip.pick.orphan:hover .n{background:rgba(255,255,255,.28);color:#fff}
.identchip.pick:hover .n{background:rgba(255,255,255,.28);opacity:.95}
.identadd{display:flex;gap:8px}
.identadd input{flex:1;min-width:0;background:var(--ground);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 13px;font-size:14px}
.identadd input:focus{border-color:var(--green);outline:none;
  box-shadow:0 0 0 3.5px color-mix(in srgb, var(--green) 18%, transparent)}
.identadd .btn{flex:none;padding:11px 15px}

/* icon + colour picker */
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pickgrid button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--ground);border-radius:12px;
  cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0;transition:background .15s,color .15s,border-color .15s}
.pickgrid button svg{width:19px;height:19px;fill:none}
.pickgrid button[aria-pressed="true"]{background:var(--hg,var(--grad-good));border-color:transparent;color:#fff}
.colgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.colgrid button{aspect-ratio:1;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0;
  transition:transform .13s;background-clip:padding-box}
.colgrid button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.pickgrid{max-height:210px;overflow-y:auto;padding-right:2px}

/* metric switcher + chart */
.mswitch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mswitch button{border:0;border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);cursor:pointer;
  transition:background .15s,color .15s}
.mswitch button[aria-pressed="true"]{background:var(--hg,var(--grad-good));color:#fff}
.chartwrap{background:var(--surface-3);border-radius:14px;padding:10px 6px 4px;margin-top:4px}
.chart-legend{display:flex;gap:12px;justify-content:center;margin-top:6px;font-family:var(--f-mono);
  font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:block}
.chart-legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);height:2px}
.rdrow{display:flex;align-items:center;gap:10px;background:var(--ground);border:1.5px solid var(--line);
  border-radius:12px;padding:8px 10px;margin-bottom:6px}
.rdrow .v{font-family:var(--f-fun);font-weight:600;font-size:16px;flex:none;min-width:58px}
.rdrow .v small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);font-weight:400}
.rdrow .w{flex:1;min-width:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;color:var(--muted)}
.nodata{text-align:center;padding:18px 10px;color:var(--muted);font-size:12.5px;line-height:1.55}

.metric{background:var(--ground);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.metric-t{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.metric-t .nm{flex:1;min-width:0;padding:7px 9px}
.metric-f{display:flex;gap:7px}
.metric-f input{flex:1;min-width:0;padding:8px 10px;font-size:13px}

/* ── scorecard ── */
.sc-row{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:var(--r-sm);
  padding:10px 11px;margin-bottom:8px;border:1px solid var(--line-soft);box-shadow:var(--shadow-s);
  touch-action:pan-y}
.sc-row.hab{background:linear-gradient(120deg,
    color-mix(in srgb, var(--hc, var(--green)) 5%, var(--surface)) 0%,
    color-mix(in srgb, var(--hc, var(--green)) 22%, var(--surface)) 100%);
  border-color:color-mix(in srgb, var(--hc, var(--green)) 30%, var(--line-soft))}
.sc-ic{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff}
.sc-ic svg{width:17px;height:17px;fill:none}
.sc-row.hab .sc-t .tag{color:var(--hc,var(--green-deep))}
.sc-row.dragging{opacity:.92;box-shadow:var(--shadow-m);transform:scale(1.02);position:relative;z-index:10}
.sc-row.ghost{opacity:.35}
.grip{width:28px;height:36px;flex:none;border:0;background:none;color:var(--muted);cursor:grab;
  display:grid;place-items:center;padding:0;touch-action:none}
.grip:active{cursor:grabbing}
.grip svg{width:15px;height:15px;fill:none}
.sc-t{flex:1;font-size:14px;min-width:0;overflow-wrap:anywhere;font-weight:600}
.sc-t .tag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--green-deep);display:block;margin-top:3px}
.ratebox{width:42px;height:42px;flex:none;border-radius:14px;border:2px solid var(--line);background:var(--ground);
  cursor:pointer;display:grid;place-items:center;font-family:var(--f-fun);font-weight:600;font-size:21px;
  color:var(--muted);padding:0;transition:background .18s,color .18s,border-color .18s,transform .12s;line-height:1}
.ratebox:active{transform:scale(.9)}
.ratebox[data-r="+"]{background:var(--grad-good);border-color:transparent;color:#fff}
.ratebox[data-r="="]{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.ratebox[data-r="-"]{background:var(--grad-bad);border-color:transparent;color:#fff}
.sc-add{display:flex;gap:8px;margin-bottom:14px}
.sc-add input{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
  padding:12px 17px;font-size:14px}
.sc-add input:focus{border-color:var(--green);outline:none;
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--green) 18%,transparent)}
.sc-tally{display:flex;gap:8px;margin-bottom:15px}
.tally{flex:1;border-radius:14px;padding:10px;text-align:center}
.tally.p{background:var(--wash-green)} .tally.n{background:var(--wash-red)} .tally.z{background:var(--surface-2)}
.tally b{font-family:var(--f-fun);font-size:22px;font-weight:600;display:block;line-height:1}
.tally.p b{color:var(--green-deep)} .tally.n b{color:var(--red-deep)} .tally.z b{color:var(--ink-2)}
.tally span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);display:block;margin-top:4px}

/* ── progress ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:var(--r-sm);padding:14px 15px;background:var(--surface);border:1px solid var(--line-soft);
  box-shadow:var(--shadow-s)}
.stat .v{font-family:var(--f-fun);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;
  line-height:1;letter-spacing:-.025em}
.stat .k{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-top:6px}
.stat.grad{border:0;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-s)}
.stat.grad .v{color:#fff}
.stat.grad .k{color:rgba(255,255,255,.82)}
.stat.grad::after{content:"";position:absolute;right:-26px;top:-30px;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3) 0%,transparent 70%)}
.stat.grad > *{position:relative;z-index:1}
.stat.g1{background:linear-gradient(140deg,#4338CA 0%,#2563EB 100%)}
.stat.g2{background:linear-gradient(140deg,#047857 0%,#34D399 100%)}
.stat.g3{background:linear-gradient(140deg,#0D9488 0%,#22D3EE 100%)}
.stat.g4{background:linear-gradient(140deg,#0891B2 0%,#6EE7B7 100%)}

.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-s);
  margin-bottom:11px;border:1px solid var(--line-soft)}
.panel-h{display:flex;align-items:center;gap:13px;margin-bottom:11px}
.panel h3{font-family:var(--f-disp);font-size:17px;font-weight:700;margin:0;line-height:1.22;
  letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
.panel p.d{font-size:12.5px;color:var(--muted);margin:0 0 13px;line-height:1.55}
canvas{display:block;width:100%;height:auto}

.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-fun);
  font-weight:600;font-size:15px;letter-spacing:-.02em;color:var(--ink)}
.ring .tx small{font-size:9px}

.cal{display:flex;gap:6px;margin-top:11px;align-items:stretch}
.cal-dow{display:grid;grid-template-rows:repeat(7,1fr);gap:2px;flex:none}
.cal-dow span{font-family:var(--f-mono);font-size:8px;color:var(--muted);display:flex;align-items:center;line-height:1}
.mgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:2px;flex:1;min-width:0}
.mgrid i{aspect-ratio:1;border-radius:3px;background:var(--grid-empty);display:block;cursor:pointer}
.mgrid i[data-s="done"],.mgrid i[data-s="clean"]{background:var(--grad-good)}
.mgrid i[data-s="two"]{background:var(--green);opacity:.45}
.mgrid i[data-s="slip"],.mgrid i[data-s="miss"]{background:var(--grad-bad)}
.mgrid i[data-s="off"]{background:var(--grid-off)}
.mgrid i[data-s="future"]{background:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:13px;font-family:var(--f-mono);font-size:9px;
  color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

.urge{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s)}
.urge-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.urge .when{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase;flex:1;min-width:0}
.badge{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px}
.badge.held{background:var(--wash-green);color:var(--green-deep)}
.badge.gave{background:var(--wash-red);color:var(--red-deep)}
/* An urge you held is tinted with its own habit's colour; one you gave in to
   takes the failure red, which must never blend into a habit's palette. The
   habit's name keeps the habit colour either way, so a red card still tells
   you at a glance which habit it belonged to. */
.urge.held{background:linear-gradient(165deg,
    color-mix(in srgb, var(--hc, var(--green)) 5%, var(--surface)) 0%,
    color-mix(in srgb, var(--hc, var(--green)) 22%, var(--surface)) 100%);
  border-color:color-mix(in srgb, var(--hc, var(--green)) 26%, var(--line-soft))}
.urge.gave{background:linear-gradient(165deg,
    color-mix(in srgb, var(--red) 6%, var(--surface)) 0%,
    color-mix(in srgb, var(--red) 24%, var(--surface)) 100%);
  border-color:color-mix(in srgb, var(--red) 34%, var(--line-soft))}
.urge .hname{flex:1;min-width:0;font-weight:700;font-size:13.5px;color:var(--ht);overflow-wrap:anywhere}
.urge .when{flex:none}
.urge.held .badge.held{background:var(--hg, var(--grad-good));color:#fff}
.urge.gave .badge.gave{background:var(--grad-bad);color:#fff}
.urge dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 11px;font-size:13px}
.urge dt{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding-top:3px}
.urge dd{margin:0;line-height:1.45;overflow-wrap:anywhere;color:var(--ink-2)}

.tmr-banner{background:var(--hg,var(--grad-cool));color:#fff;border-radius:var(--r-sm);padding:13px 16px;
  margin:16px 0 0;display:flex;align-items:center;gap:13px}
.tmr-banner .c{font-family:var(--f-fun);font-size:27px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1}
.tmr-banner .n{flex:1;min-width:0;font-size:12.5px;opacity:.88;overflow-wrap:anywhere}
.tmr-face{text-align:center;padding:16px 0 20px}
.tmr-face .c{font-family:var(--f-fun);font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;background:var(--hg,var(--grad-primary));-webkit-background-clip:text;
  background-clip:text;color:transparent}
/* the sheet takes the habit's gradient wherever it would have used the app's */
.tmr-wrap .btn.primary,.tmr-wrap .seg button[aria-pressed="true"]{background:var(--hg,var(--grad-primary))}
.tmr-wrap .btn.cool{background:var(--hg,var(--grad-cool))}
.tmr-wrap .btn.line{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hc,var(--green)) 45%,var(--line));
  color:var(--ht,var(--ink-2))}
.tmr-wrap .hint,.tmr-wrap .foot strong{color:var(--ht,var(--muted))}
.tmr-face .m{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-top:10px}

/* ── guide ── */
.g-hero{border-radius:var(--r);padding:22px;background:var(--grad-primary);color:#fff;margin-bottom:22px;
  position:relative;overflow:hidden;box-shadow:var(--shadow-glow)}
.g-hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(250,204,21,.4) 0%,transparent 68%)}
.g-hero h2{font-family:var(--f-fun);font-size:25px;font-weight:600;margin:0 0 8px;line-height:1.15;
  letter-spacing:-.02em;position:relative;z-index:1}
.g-hero p{margin:0;font-size:13.5px;line-height:1.55;opacity:.94;position:relative;z-index:1}
.loop{display:flex;align-items:center;gap:6px;margin-top:16px;position:relative;z-index:1}
.loop-s{flex:1;text-align:center;background:rgba(255,255,255,.18);border-radius:12px;padding:9px 4px}
.loop-s svg{width:19px;height:19px;stroke:#fff;margin-bottom:4px}
.loop-s span{display:block;font-family:var(--f-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.95}
.loop-a{color:rgba(255,255,255,.6);font-size:13px;flex:none}

.guide-law{margin-bottom:26px}
.gl-head{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.gl-head .chev{transition:transform .22s}
.gl-head .chev svg{width:17px;height:17px;display:block}
.gl-ic{width:52px;height:52px;border-radius:17px;flex:none;display:grid;place-items:center;color:#fff;
  background:var(--lg,var(--grad-good));position:relative;overflow:hidden;box-shadow:var(--shadow-s)}
.gl-ic::after{content:"";position:absolute;right:-14px;top:-16px;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.36) 0%,transparent 70%)}
.gl-ic svg{width:26px;height:26px;fill:none;position:relative;z-index:1}
.gl-tt{min-width:0}
.gl-tt .n{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--lc,var(--green-deep));display:block;margin-bottom:2px}
.gl-tt h3{font-family:var(--f-fun);font-size:25px;font-weight:600;margin:0;line-height:1.1;letter-spacing:-.02em}
.gl-tt .q{font-size:13.5px;color:var(--muted);margin:2px 0 0;font-weight:600}

.tac{background:var(--surface);border-radius:var(--r-sm);padding:13px 14px;margin-bottom:8px;
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s)}
.tac-h{display:flex;gap:11px;align-items:flex-start}
.tac-ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--lg,var(--grad-good));color:#fff;box-shadow:var(--shadow-s)}
.tac-ic svg{width:18px;height:18px;fill:none}
.tac .b{min-width:0;flex:1}
.tac .id{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.09em;display:block;margin-bottom:1px}
.tac b{display:block;font-size:14.5px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em;font-family:var(--f-ui)}
.tac p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.tac p em{font-style:normal;font-weight:700;color:var(--ink-2)}
.ex{margin-top:10px;background:var(--lw,var(--wash-green));border-radius:12px;padding:10px 12px;
  display:flex;gap:9px;align-items:flex-start}
.ex svg{width:15px;height:15px;stroke:var(--lc,var(--green-deep));flex:none;margin-top:2px}
.ex p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.ex p b{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--lc,var(--green-deep));display:block;margin-bottom:3px;font-weight:500}

.quote{border-radius:var(--r);padding:22px;margin:0 0 24px;background:var(--grad-soft);border:1px solid var(--line-soft)}
.quote p{font-family:var(--f-fun);font-size:21px;line-height:1.28;margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:pretty}
.quote cite{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-style:normal;display:block;margin-top:12px}

.idea{background:var(--surface);border-radius:var(--r-sm);padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s)}
.idea{background:var(--iw,var(--surface))}
.idea-ic{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:var(--ig,var(--grad-cool));color:#fff;box-shadow:var(--shadow-s)}
.idea-ic svg{width:20px;height:20px;fill:none}
.idea b{display:block;font-family:var(--f-fun);font-size:16px;font-weight:600;margin-bottom:2px;
  color:var(--ic2,var(--ink))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .idea b{color:var(--ink)}}
:root[data-theme="dark"] .idea b{color:var(--ink)}
.idea p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}

.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:11px 19px;border-radius:999px;font-size:13px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:88vw;text-align:center;
  box-shadow:var(--shadow-m)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
hr.rule{border:0;border-top:1px solid var(--line);margin:24px 0}
.foot{text-align:center;color:var(--muted);font-size:11.5px;line-height:1.65;padding:8px 0 0}
.picklist{max-height:44vh;overflow-y:auto;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;
  margin-bottom:7px;border:1px solid var(--line-soft)}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--green)}
.pick .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.pick .s{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;display:block;margin-top:2px}
/* ══════════ Persian: Safavid tile and carpet palette ══════════
   The English skin keeps its 2026 greens. Switching to Persian switches the
   whole ground under the app: ivory plaster instead of mint, lapis and
   turquoise off a mosque dome, madder and saffron out of a carpet field.
   Only the tokens change — every component already reads them. The skin is
   its own attribute, so it can be worn by an English page too. */
:root[data-skin="fa"]{
  --ground:#F7F1E3; --surface:#FFFCF5; --surface-2:#F0E7D2; --surface-3:#FAF5EA;
  --line:#DFD0B2; --line-soft:#EBE0C9;
  --ink:#1B2233; --ink-2:#4A4536; --muted:#8A7E64; --on-accent:#FFFCF5;

  --green:#1E7A5E; --green-deep:#12553F; --green-bright:#3FA07C; --green-pop:#7FC9A8;
  --teal:#17858B; --petrol:#0E5B63;
  --turq:#2BA9A0; --turq-bright:#4FC9BC;
  --lapis:#1A4B8C; --indigo:#2B3A8F;
  --yellow:#E0A32E; --amber:#C8811B;
  --red:#A32638; --red-deep:#7E1826; --red-soft:#D98692;

  --wash-green:#DDEDE3; --wash-teal:#DAEBEB; --wash-turq:#DCEFEC;
  --wash-indigo:#E2E3F2; --wash-yellow:#F7EBCF; --wash-red:#F5DDDF;

  --grad-primary:linear-gradient(135deg,#1A4B8C 0%,#17858B 48%,#2BA9A0 100%);
  --grad-good:linear-gradient(135deg,#12553F 0%,#1E7A5E 50%,#4FB58C 100%);
  --grad-cool:linear-gradient(135deg,#2B3A8F 0%,#1A4B8C 42%,#2BA9A0 100%);
  --grad-bad:linear-gradient(135deg,#7E1826 0%,#A32638 55%,#C9566A 100%);
  --grad-warn:linear-gradient(135deg,#C8811B 0%,#E0A32E 100%);
  --grad-soft:linear-gradient(140deg,#F0E7D2 0%,#DCEFEC 52%,#E2E3F2 100%);
  --grad-fab:linear-gradient(140deg,#1A4B8C 0%,#17858B 42%,#2BA9A0 100%);

  --grid-empty:#E4D8BE; --grid-off:#F0E9DA;
  --shadow-s:0 1px 2px rgba(60,42,20,.06), 0 2px 10px -5px rgba(60,42,20,.16);
  --shadow-m:0 2px 6px rgba(60,42,20,.08), 0 16px 32px -20px rgba(60,42,20,.34);
  --shadow-glow:0 12px 32px -12px rgba(26,75,140,.45);
  --shadow-fab:0 8px 22px -6px rgba(23,133,139,.5), 0 2px 6px rgba(60,42,20,.2);

}
/* the faces follow the script, not the skin */

[dir="rtl"] *{letter-spacing:normal!important}

/* ─────────── habit logic ─────────── */
function habit(id){ for(var i=0;i<S.habits.length;i++) if(S.habits[i].id===id) return S.habits[i]; return null; }
function activeHabits(){ return S.habits.filter(function(h){ return !h.archived; }); }
function isTask(h){ return h.kind!=="break" && h.mode==="task"; }
function weeklyTargetOf(h){ return (isTask(h)&&h.taskMode==="per"&&h.perUnit==="week") ? h.perCount : null; }

function slotsForDate(h,date){
  if(h.kind==="break"||h.mode!=="habit") return [];
  if(!h.slots.length) return [];
  return h.slots.filter(function(s){ return s.days.indexOf(dow(date))>-1; });
}
function scheduled(h,date){
  if(date<h.created) return false;
  if(h.endDate && date>h.endDate) return false;
  if(h.kind==="break") return true;
  if(h.mode==="task"){
    if(h.taskMode==="per") return true;
    var n=Math.max(1,h.everyCount);
    if(h.everyUnit==="day") return daysBetween(h.created,date)%n===0;
    if(h.everyUnit==="week") return Math.floor(daysBetween(weekStart(h.created),weekStart(date))/7)%n===0;
    return true;
  }
  if(!h.slots.length) return true;
  return slotsForDate(h,date).length>0;
}
function perDayFor(h,date){
  if(h.kind==="break") return 1;
  if(h.mode==="task"){
    if(h.taskMode==="per") return h.perUnit==="day" ? h.perCount : 1;
    if(h.everyUnit==="minute") return clamp(Math.round(960/Math.max(1,h.everyCount)),1,48);
    if(h.everyUnit==="hour") return clamp(Math.round(16/Math.max(1,h.everyCount)),1,24);
    return 1;
  }
  return Math.max(1, slotsForDate(h,date).length);
}
function entry(hid,date){ var m=S.logs[hid]; return (m&&m[date])||null; }
function statusOf(hid,date){ var e=entry(hid,date); return e?e.s:null; }
function countOf(hid,date){ var e=entry(hid,date); return e?(+e.n||0):0; }

function fmtMS(s){
  s=Math.max(0,Math.round(s));

  return m+":"+String(r).padStart(2,"0");
}
/* compact duration for chips: hours above 60 min, whole minutes clean, else m:ss */

  s=Math.max(0,Math.round(s));
  if(s>=3600){
    var h=Math.floor(s/3600), m=Math.round((s%3600)/60);
    if(m===60){ h++; m=0; }
    return T(h+"h"+(m?" "+m+"m":""), h+" ساعت"+(m?" و "+m+" دقیقه":""));
  }
  return s%60===0 ? T((s/60)+" min",(s/60)+" دقیقه") : fmtMS(s);

var MIN_LOG_MS=120000;   /* nothing is logged until two full minutes */
function writeEntry(hid,date,patch){
  if(!S.logs[hid]) S.logs[hid]={};
  if(patch===null){ delete S.logs[hid][date]; touch(); return; }
  var e=S.logs[hid][date]||{n:0};
  Object.keys(patch).forEach(function(k){ e[k]=patch[k]; });

  touch();
}
function setStatus(hid,date,s){
  var h=habit(hid);

  var n = GOOD[s] ? (h && s==="done" ? perDayFor(h,date) : 1) : 0;
  writeEntry(hid,date,{s:s,n:n});
}

  var h=habit(hid); if(!h) return;
  if(h.kind==="break"){
    var order=["clean","slip",null], cur=statusOf(hid,date);
    return setStatus(hid,date,order[(order.indexOf(cur)+1)%order.length]);
  }
  var target=perDayFor(h,date), st=statusOf(hid,date), c=countOf(hid,date);
  if(st==="done") return setStatus(hid,date,"two");
  if(st==="two") return setStatus(hid,date,"miss");
  if(st==="miss") return writeEntry(hid,date,null);
  var n=c+1;

}
function kept(hid,date){ var s=statusOf(hid,date); return !!(s&&GOOD[s]); }

function periodKept(h,date,unit){
  var d=fromISO(date), n=0, m=S.logs[h.id]||{};
  for(var k in m){
    if(!GOOD[m[k].s]) continue;
    var kd=fromISO(k);
    if(unit==="month" && kd.getFullYear()===d.getFullYear() && kd.getMonth()===d.getMonth()) n++;
    if(unit==="year" && kd.getFullYear()===d.getFullYear()) n++;

function streak(h){

    var wk=weekStart(today()), n=0, g=0, t=weeklyTargetOf(h);
    if(weekKept(h,wk)<t) wk=shift(wk,-7);
    while(g++<400){
      if(shift(wk,6)<h.created) break;
      if(weekKept(h,wk)>=t){ n++; wk=shift(wk,-7); } else break;
    }
    return n;
  }
  var d=today(), c=0, guard=0;
  if(scheduled(h,d)&&!kept(h.id,d)) d=shift(d,-1);
  while(guard++<2000){
    if(d<h.created) break;
    if(!scheduled(h,d)){ d=shift(d,-1); continue; }
    if(kept(h.id,d)){ c++; d=shift(d,-1); } else break;
  }
  return c;
}
function slippedLast(h){

  while(g++<400){

    d=shift(d,-1);
  }

function reps(h){ var m=S.logs[h.id]||{}, n=0; for(var d in m) if(GOOD[m[d].s]) n+=Math.max(1,+m[d].n||1); return n; }
function totalVotes(){ var n=0; for(var hid in S.logs){ var m=S.logs[hid]; for(var d in m) if(GOOD[m[d].s]) n+=Math.max(1,+m[d].n||1); } return n; }

function overallMultiplier(){

}
function todaysHabits(){ var d=today(); return activeHabits().filter(function(h){ return scheduled(h,d); }); }

function nextDue(h){
  if(!isTask(h)||h.taskMode!=="every") return null;

  var e=entry(h.id,today());
  if(!e||!e.t) return T("now","همین حالا");
  var ms=h.everyUnit==="hour"? h.everyCount*3600000 : h.everyCount*60000;
  var due=e.t+ms;
  if(Date.now()>=due) return T("now","همین حالا");

}
function rhythmText(h){

  if(isTask(h)){
    if(h.taskMode==="per") return T(h.perCount+"× per "+h.perUnit, h.perCount+" بار در "+unitName(h.perUnit));
    return T("every "+h.everyCount+" "+h.everyUnit+(h.everyCount>1?"s":""), "هر "+h.everyCount+" "+unitName(h.everyUnit));
  }

function activeMetric(h){ for(var i=h.metrics.length-1;i>=0;i--) if(h.metrics[i].active) return h.metrics[i]; return null; }
function readingsFor(hid,mid){
  return S.readings.filter(function(r){ return r.habitId===hid&&r.metricId===mid; })
    .sort(function(a,b){ return a.date<b.date?-1:1; });
}
function metricPct(h,m){
  if(!m) return null;
  var rs=readingsFor(h.id,m.id);
  if(!rs.length) return null;
  var start=(m.start===0||m.start)?+m.start:+rs[0].value;
  var target=(m.target===0||m.target)?+m.target:null;
  var latest=+rs[rs.length-1].value;
  if(target===null||target===start) return null;
  return clamp(Math.round((latest-start)/(target-start)*100),0,100);
}
function progressPct(h){

  if(p!==null) return {pct:p,label:m.label};
  var c=consistency(h);
  if(c!==null) return {pct:c,label:T("days kept","روزهای نگه‌داشته")};

}
function keptCount(h){ var m=S.logs[h.id]||{}, n=0; for(var d in m) if(GOOD[m[d].s]) n++; return n; }

/* the measures a habit can chart: its metrics, plus time when the timer is on */
/* a focus block logs minutes against a habit that may never have been set up

function hasTime(h){
  var m=S.logs[h.id];
  if(!m) return false;
  for(var d in m){
    if(!m.hasOwnProperty(d)) continue;
    if((+m[d].secs||0)>0 || (+m[d].mins||0)>0) return true;
  }

function chartables(h){

  });

}
function chosenChart(h){

  for(var i=0;i<list.length;i++) if(list[i].key===h.chartMetric) return list[i];
  for(var j=list.length-1;j>=0;j--) if(list[j].kind==="metric"&&list[j].m.active) return list[j];

function habitAge(h){ return Math.max(0, daysBetween(h.created, today())); }
function scaffoldOn(){ return S.settings.scaffold!==false; }
function fadeStage(h){

}
/* Teaching copy fades on the same curve a card's tactics do. It is keyed to

   what is being learned here is the app, not any one habit — and it stops for
   good the moment a first habit implants, which is the point at which you

function hintScaffoldOn(){ return S.settings.hintScaffold!==false; }

  if(!hintScaffoldOn()) return 0;            /* switched off: every tip stays */

  if(S.habits.some(implanted)) return 99;    /* a first habit has landed */
  var a=0;
  S.habits.forEach(function(h){ a=Math.max(a,habitAge(h)); });
  return a>=FADE_DAYS?4:Math.min(4,Math.floor(a/(FADE_DAYS/(STAGES-1))));

function tip(level,html){ return hintStage()<=level ? html : ""; }
function detailsOpen(h){ return h.showDetails===true; }
function summaryLines(h){

var LAWIC={obvious:"eye",attractive:"magnet",easy:"feather",satisfying:"star",

    g.push([T("Make it obvious","آشکارش کن"),"obvious",[[T("Stack on","سوار بر"),h.stackAfter],[T("Place","مکان"),h.place],[T("Cue","نشانه"),h.envCue]]]);
    g.push([T("Make it attractive","جذابش کن"),"attractive",[[T("Paired with","همراه با"),h.bundle],[T("Ritual","آیین"),h.ritual]]]);
    g.push([T("Make it easy","ساده‌اش کن"),"easy",[[T("2-min","دودقیقه‌ای"),h.twoMin],[T("Friction cut","اصطکاکِ حذف‌شده"),h.friction]]]);
    g.push([T("Make it satisfying","خوشآیندش کن"),"satisfying",[[T("Reward","پاداش"),h.reward],[T("Watched by","ناظر"),h.partner]]]);

          .filter(function(x){ return x[2].length; });
}

function saveIntention(){
  var f=focusLive(); if(!f){ closeSheet(); return; }
  var v={};
  $$("[data-k]",$("#sheet")).forEach(function(el){ v[el.dataset.k]=el.value.trim(); });
  if(!v.action){ toast(T("Name the first action","قدمِ اول را بنویس")); var a=$("#f-action"); if(a) a.focus(); return; }
  f.time=v.time||""; f.place=v.place||""; f.action=v.action;
  f.mins=clamp(Math.round(+v.fmins||startMins()),1,180);
  /* an empty field means "fall back", which + would read as zero */
  var vo=parseInt(v.ontime,10), vg=parseInt(v.grace,10);
  f.ontime = isFinite(vo)&&vo>=0 ? clamp(vo,0,720) : null;
  f.grace  = isFinite(vg)&&vg>=0 ? clamp(vg,0,720) : null;
  touch(); closeSheet(); renderAll();
  toast(T("Intention set","نوشته شد"));
}

function saveCommit(){
  var f=focusLive(); if(!f){ closeSheet(); return; }
  var v={};
  $$("[data-k]",$("#sheet")).forEach(function(el){ v[el.dataset.k]=el.value.trim(); });
  if(!v.deliverable){ toast(T("Name the deliverable","بنویس چه چیزی تحویل می‌دهی")); return; }
  if(!v.due||v.due<=today()){ toast(T("Pick a date after today","تاریخی بعد از امروز انتخاب کن")); return; }
  var n=clamp(Math.round(+v.checks||3),1,12), c=commitOf(f);
  if(!c){ c={ id:uid(), created:today(), closedAt:null, delivered:false, checks:[] };
    S.commitments.unshift(c); f.commitId=c.id; }
  var same = c.due===v.due && c.checks.length===n;
  c.deliverable=v.deliverable; c.person=v.person||""; c.due=v.due;
  if(!same){
    /* re-spacing keeps the ticks whose dates survive the move */
    var met={};
    c.checks.forEach(function(k){ if(k.met===true) met[k.date]=1; });
    c.checks=spaceChecks(today(),v.due,n);
    c.checks.forEach(function(k){ if(met[k.date]) k.met=true; });
  }
  touch(); closeSheet(); renderAll();
  toast(T("Deadline set","مهلت گذاشته شد"));
}

/* ── the start itself, and the question that ends the block ── */
function recordStart(mins,after){
  var f=focusLive(), tm=S.timer||{};
  var o={ id:uid(), date:today(), t:Date.now(), focusId:f?f.id:null,
    habitId:tm.habitId||(f?f.habitId:null), planned:tm.planned||(f?f.time:""),
    onTime:tm.onTime!==false, mins:Math.max(0,Math.round(mins)),
    after:(after==="going"?"going":"stopped") };
  S.starts.unshift(o);
  if(S.starts.length>1000) S.starts.length=1000;
  touch();
  return o.id;
}
function bumpStart(id,mins){
  S.starts.forEach(function(s){ if(s.id===id) s.mins=Math.max(s.mins,Math.round(mins)); });
  touch();
}
function startFocus(){
  var f=focusLive(), x=focusHabit();
  if(!f){ openFocusPick(); return; }
  if(!f.action){ openIntention(); return; }
  if(!S.timer||S.timer.habitId!==x.id){
    S.timer={ habitId:x.id, startedAt:Date.now(), accumulated:0, running:true,
      mode:"down", targetMs:f.mins*60000,
      /* the two flags the start record needs, frozen at the moment of starting */
      focus:true, startRef:null, planned:f.time, onTime:onTimeNow(f) };
    touch();
  }
  renderAll(); openTimer(x.id);
}

        "هر دو یکی حساب می‌شوند. در هر صورت آن "+mins+" دقیقه ثبت می‌شود و امروزِ این عادت تیک می‌خورد.")+"</p></div>";

function afterStart(kind){
  var tm=S.timer; if(!tm){ closeSheet(); return; }
  var el=timerElapsed(), mins=Math.max(1,Math.round(el/60000));
  if(kind==="going"){
    var sid = tm.focus ? recordStart(mins,"going") : tm.startRef;
    /* the block is answered; from here it is an open stopwatch whose total
       flows back into the same start record instead of making a second one */
    tm.focus=false; tm.startRef=sid;
    tm.mode="up"; tm.accumulated=el; tm.startedAt=Date.now(); tm.running=true;
    touch(); closeSheet(); renderAll(); openTimer(tm.habitId);
    toast(T("Start recorded — carry on","شروع ثبت شد. ادامه بده")); return;
  }
  var hid=tm.habitId, secs=Math.round(el/1000);
  writeEntry(hid,today(),{secs:secsOf(hid,today())+secs,mins:undefined});
  /* the work happened, so the day gets its stamp and its vote — the same one
     the timer's own Complete button leaves */
  setStatus(hid,today(),"done");
  if(tm.focus) recordStart(mins,"stopped"); else if(tm.startRef) bumpStart(tm.startRef,mins);
  S.timer=null; touch(); closeSheet(); renderAll();
  toast(T("Start recorded. That was the hard part.","ثبت شد — هم شروع، هم تیکِ امروز."));
}

function todayCard(x){

function timerElapsed(){ var t=S.timer; if(!t) return 0; return (+t.accumulated||0)+(t.running?Date.now()-t.startedAt:0); }
function timerBannerHTML(){
  var t=S.timer; if(!t) return "";

    + '<div class="n">'+esc(x.name)+(t.running?T(" &middot; running"," &middot; در حال اجرا"):T(" &middot; paused"," &middot; متوقف"))+"</div>"
    + '<button class="btn sm ghost" data-timer="'+x.id+'">'+T("Open","بازش کن")+"</button></div>";

var tmrTick=null;
function startTick(){
  clearInterval(tmrTick);
  tmrTick=setInterval(function(){
    if(!S.timer){ clearInterval(tmrTick); return; }
    var t=S.timer, el=timerElapsed(), show=t.mode==="down"?Math.max(0,t.targetMs-el):el;
    var a=$("#tmrLive"), b=$("#tmrFace");
    if(a) setText(a,clockStr(show));
    if(b) setText(b,clockStr(show));
    /* live-unlock the log buttons the moment two minutes pass */
    var pb=$('[data-tmr="part"]'), lb=$('[data-tmr="log"]');
    if(pb){
      var ready=el>=MIN_LOG_MS;
      if(pb.disabled===ready){ openTimer(t.habitId); return; }
      if(ready) setText(pb.lastChild, T("Stop and log ","نگه دار و ثبت کن: ")+fmtMS(el/1000));
    }
    if(lb && el<MIN_LOG_MS){
      var hint=lb.previousElementSibling;
      if(hint&&hint.className==="hint") setHTML(hint, T("Both buttons unlock at two minutes &mdash; ","هر دو دکمه سرِ دو دقیقه باز می‌شوند &mdash; ")+fmtMS((MIN_LOG_MS-el)/1000)+T(" to go."," مانده."));
    }
    if(t.mode==="down"&&t.running&&el>=t.targetMs){
      t.running=false; t.accumulated=t.targetMs; touch(); renderAll();
      /* a focus block ending asks keep-going or stop-here; both are a start */
      if(t.focus){ toast(T("Block done","بلوک تمام شد")); openAfterStart(); }
      else { toast(T("Time is up","وقت تمام شد")); openTimer(t.habitId); }
    }
  },500);
}
function openTimer(hid){
  var x=habit(hid); if(!x) return;

    S.timer={habitId:hid,startedAt:0,accumulated:0,running:false,
      mode:x.minutesTarget?"down":"up", targetMs:(x.minutesTarget||0)*60000};
    touch();
  }
  var t=S.timer, el=timerElapsed(), show=t.mode==="down"?Math.max(0,t.targetMs-el):el;
  /* a focus block sets its own target, so the label reads the timer rather than

  var tmin=Math.round((t.targetMs||0)/60000);

    + '<div class="row" style="margin-bottom:12px">'
    + '<button class="btn '+(t.running?"ghost":"primary")+'" data-tmr="toggle" style="flex:1">'+(t.running?T("Pause","مکث"):T("Start","شروع"))+"</button>"

  if(x.minutesTarget) h+='<div class="seg sm" style="margin-bottom:12px">'

    + '<button data-tmrmode="up" aria-pressed="'+(t.mode==="up")+'">'+T("Stopwatch","کرنومتر")+"</button></div>";
  var ready = el>=MIN_LOG_MS, dis = ready?"":" disabled";
  h+='<button class="btn cool wide" data-tmr="part"'+dis+'>'+ic("clock")+T("Stop and log ","نگه دار و ثبت کن: ")+fmtMS(el/1000)+"</button>"
    + '<div class="hint" style="text-align:center;margin:6px 0 12px">'
    + (ready ? T("Keeps the exact time without marking the habit done &mdash; pick the timer up again later today.",
                 "زمان را مو به مو نگه می‌دارد بی‌آنکه عادت را انجام‌شده علامت بزند &mdash; بعداً همین امروز می‌توانی دوباره ادامه بدهی.")
             : T("Both buttons unlock at two minutes &mdash; ","هر دو دکمه سرِ دو دقیقه باز می‌شوند &mdash; ")+fmtMS((MIN_LOG_MS-el)/1000)+T(" to go."," مانده."))
    + "</div>"
    + '<button class="btn primary wide" data-tmr="log"'+dis+">"+T("Complete","تمام شد")+"</button>"
    + '<button class="btn ghost wide" data-tmr="drop" style="margin-top:9px">'+T("Discard timer","دور انداختنِ زمان‌سنج")+"</button>"
    /* the escape hatch, one tap away for as long as the block is running */
    + ((t.focus||t.startRef) ? '<button class="btn line wide" data-stlater="1" style="margin-top:9px">'
        + ic("bookmark")+T("Something is pulling at me","یک چیزی دارد می‌کشد مرا") + "</button>" : "")
    + '<p class="foot">'+T("Logged today: ","امروز ثبت‌شده: ")+fmtMS(secsOf(hid,today()))
    + (x.minutesTarget? T(" of "," از ")+x.minutesTarget+T(" min"," دقیقه")+" &middot; <strong>"+fmtDur(leftSecs(x,today()))+T(" left"," مانده")+"</strong>":"")+"</p>";
  openSheet(T("Timer · ","زمان‌سنج · ")+x.name, h+"</div>");
  startTick();

function readEditor(){
  var st=$("#sheet");
  /* merge whatever is on screen into the store; collapsed sections keep their earlier values */
  $$("[data-k]",st).forEach(function(el){ edVals[el.dataset.k]=el.value.trim(); });
  syncSlots(); syncMetrics();
  return { kind:st.dataset.kind||"build", vals:edVals, slots:edSlots.slice(),
           metrics:edMetrics.slice(), open:edOpen, idents:edIdents.slice() };
}
function syncSlots(){
  var st=$("#sheet"); if(!st) return;
  $$("[data-slot]",st).forEach(function(el){
    var i=+el.dataset.slot; if(!edSlots[i]) return;
    var f=el.dataset.sf;
    edSlots[i][f] = f==="dur" ? (el.value===""?null:+el.value) : el.value;
  });
}
function syncMetrics(){
  var st=$("#sheet"); if(!st) return;
  $$("[data-met]",st).forEach(function(el){
    var i=+el.dataset.met; if(edMetrics[i]) edMetrics[i][el.dataset.mf]=el.value;
  });
}
function saveDraft(){
  var st=$("#sheet"); if(!st) return;
  var btn=st.querySelector("[data-save]");
  if(!btn||btn.dataset.save) return;
  var d=readEditor();
  if(!d.vals.name&&!d.vals.identity) return;
  S.draft=d; S.draft.savedAt=Date.now();
  persist();
}

  if(!x) x={ id:uid(), created:today(), archived:false, metrics:[] };
  x.kind=d.kind;
  x.identityIds = edIdents.slice();
  ["name","stackAfter","place","envCue","bundle","ritual","twoMin","friction",
   "reward","partner","removeCues","reframe","addFriction","commitment","contract","replacement",
   "icon","color"
  ].forEach(function(k){ if(d.vals[k]!==undefined) x[k]=d.vals[k]; });
  x.mode = d.vals.mode==="task"?"task":"habit";
  x.taskMode = d.vals.taskMode==="every"?"every":"per";
  x.perCount = +d.vals.perCount||1;
  x.perUnit = ["day","week","month","year"].indexOf(d.vals.perUnit)>-1?d.vals.perUnit:"day";
  x.everyCount = +d.vals.everyCount||4;
  x.everyUnit = ["minute","hour","day","week"].indexOf(d.vals.everyUnit)>-1?d.vals.everyUnit:"hour";
  x.slots = d.kind==="break"||x.mode==="task" ? [] : d.slots.map(normSlot);
  x.minutesTarget = +d.vals.minutesTarget||null;
  x.useTimer = d.vals.useTimer==="1";
  x.endDate = d.vals.endDate||null;
  x.gainPct = (d.vals.gainPct===""||d.vals.gainPct==null)?1:+d.vals.gainPct;
  x.open = JSON.parse(JSON.stringify(edOpen||{}));
  var keep={};
  x.metrics = d.metrics.filter(function(m){ return (m.label||"").trim(); }).map(function(m){
    var mid=m.id||uid(); keep[mid]=1;
    return { id:mid, label:m.label.trim(), unit:(m.unit||"").trim(),
      start: m.start===""||m.start==null?null:+m.start,
      target: m.target===""||m.target==null?null:+m.target,
      active: m.active===false?false:true };
  });
  S.readings=S.readings.filter(function(r){ return r.habitId!==x.id||keep[r.metricId]; });
  normHabit(x);
  if(isNew) S.habits.push(x);
  /* promoted from a scorecard row → that row becomes this habit's row, in place */
  var fromRow=$("#sheet").dataset.fromRow;
  if(isNew&&fromRow){
    S.scorecard.forEach(function(r){
      if(r.id===fromRow){ r.kind="habit"; r.habitId=x.id; delete r.text; }
    });
  }
  S.draft=null;
  touch(); closeSheet(); renderAll();
  /* came in through the Start tab's "make a new one": adopt it and go straight
     to the intention, so the trail from "I need a thing" to "if… then…" holds */
  if(isNew&&focusWanted){ focusWanted=false; setFocusHabit(x.id); go("start"); openIntention(); return; }
  toast(isNew?(fromRow?T("Row is now a habit","این سطر شد یک عادت"):T("Habit added — first rep today","عادت اضافه شد — اولین تکرار همین امروز")):T("Saved","ذخیره شد"));
}

function drawSparks(){
  $$("canvas.spark").forEach(function(cv){
    var p=cv.dataset.metric.split("|"), rs=readingsFor(p[0],p[1]);
    if(rs.length<2) return;
    var cs=getComputedStyle(document.documentElement), C=function(n){ return cs.getPropertyValue(n).trim(); };
    var ctx=cv.getContext("2d"), w=cv.width, hh=cv.height, pad=20;
    ctx.clearRect(0,0,w,hh);
    var vals=rs.map(function(r){ return +r.value; });
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    if(mx===mn){ mx=mn+1; mn=mn-1; }
    var X=function(i){ return pad+(i/(rs.length-1))*(w-pad*2); };
    var Y=function(v){ return hh-pad-((v-mn)/(mx-mn))*(hh-pad*2); };
    var g=ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,C("--teal")); g.addColorStop(1,C("--green-bright"));
    ctx.strokeStyle=g; ctx.lineWidth=7; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    vals.forEach(function(v,i){ (i?ctx.lineTo:ctx.moveTo).call(ctx,X(i),Y(v)); });
    ctx.stroke();
    ctx.fillStyle=C("--surface"); ctx.beginPath(); ctx.arc(X(vals.length-1),Y(vals[vals.length-1]),12,0,7); ctx.fill();
    ctx.fillStyle=C("--green"); ctx.beginPath(); ctx.arc(X(vals.length-1),Y(vals[vals.length-1]),8,0,7); ctx.fill();
  });
}
