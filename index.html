/* ─────────── START: the module for not starting ───────────
   The problem this solves is not persistence, it is the doorstep. So every
   number here is small on purpose, and every path through it ends in a start
   being recorded rather than a habit being graded. */
var LATER_T={video:1,article:1,idea:1,other:1};
var FEEL_T={anxious:1,overwhelmed:1,perfect:1,bored:1,tired:1,other:1};
function laterName(k){
  return { video:T("video","ویدیو"), article:T("article","مقاله"),
           idea:T("idea","ایده"), other:T("other","چیزِ دیگر") }[k] || k;
}
function laterIcon(k){ return { video:"tv", article:"doc", idea:"brain", other:"box" }[k] || "box"; }
function feelName(k){
  return { anxious:T("anxious","مضطرب"), overwhelmed:T("overwhelmed","زیرِ بار"),
           perfect:T("perfectionism","کمال‌گرایی"), bored:T("bored","بی‌حوصله"),
           tired:T("tired","خسته"), other:T("something else","یک چیزِ دیگر") }[k] || k;
}
var FEEL_ORDER=["anxious","overwhelmed","perfect","bored","tired","other"];
/* the fallbacks a task takes when it does not set its own: ten minutes of
   work, a quarter of an hour of lateness still counts, half an hour before
   the app asks anything at all */
var START_MINS=10, GRACE_MIN=30, ONTIME_MIN=15;
function startMins(){ return START_MINS; }
/* both windows are per task: a chapter and an inbox do not deserve the same
   grace period. A task that never says otherwise falls back to 30 and 15.
   Read through win(): +null is 0 and isFinite(0) is true, so the obvious
   version quietly turns "never set" into "zero minutes". */
function win(v,dflt){
  if(v===null||v===undefined||v==="") return dflt;
  var n=+v;
  return isFinite(n)&&n>=0 ? clamp(Math.round(n),0,720) : dflt;
}
/* the storage side of the same question: keep a 0 the user typed, and keep
   "never set" as null rather than collapsing it to 0 */
function winOrNull(v){ var r=win(v,null); return r===null?null:r; }
function graceOf(f){ return win(f&&f.grace, GRACE_MIN); }
function onTimeOf(f){ return win(f&&f.ontime, ONTIME_MIN); }
function forgiveDefault(){
  return T("I put it off today. This happens to plenty of people. The reason was probably anxiety, not that I am worthless.",
           "امروز عقب انداختم. این برای خیلی‌ها پیش می‌آید. دلیلش احتمالاً اضطراب بود، نه بی‌ارزشی من.");
}
function forgiveText(){ return String(S.settings.forgiveText||"").trim() || forgiveDefault(); }

function focusHabit(){ return S.focus ? habit(S.focus.habitId) : null; }
/* every read goes through here, so a habit deleted from under the focus
   cannot leave a card pointing at nothing */
function focusLive(){ return (S.focus && focusHabit()) ? S.focus : null; }
function focusName(){ var f=focusLive(); if(!f) return ""; return f.title || (focusHabit()||{}).name || ""; }
function minsNow(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function clockMins(t){ var p=String(t||"").split(":"); return (+p[0]||0)*60+(+p[1]||0); }
function onTimeNow(f){ return !f||!f.time ? true : minsNow() <= clockMins(f.time)+onTimeOf(f); }
function startsOn(date){ return S.starts.filter(function(s){ return s.date===date; }); }
function startedToday(){ return startsOn(today()).length>0; }
function delayedToday(){ return S.delays.some(function(x){ return x.date===today(); }); }
function minsStartedToday(){
  var n=0; startsOn(today()).forEach(function(s){ n+=s.mins; }); return n;
}
/* asked at most once a day, and never once the day already has a start or a
   delay on the record — nagging is the opposite of what this module is for */
function delayDue(){
  var f=focusLive();
  if(!f||!f.time||S.settings.delayCheck===false) return false;
  if(startedToday()||delayedToday()||S.settings.lastNag===today()) return false;
  return minsNow() > clockMins(f.time)+graceOf(f);
}
function commitOf(f){
  if(!f||!f.commitId) return null;
  for(var i=0;i<S.commitments.length;i++) if(S.commitments[i].id===f.commitId) return S.commitments[i];
  return null;
}
/* n checkpoints land on the interior points of the run: with three of them
   across four weeks you are checked at week one, two and three */
function spaceChecks(from,due,n){
  var span=Math.max(1,daysBetween(from,due)), out=[];
  for(var i=1;i<=n;i++){
    var d=shift(from, Math.round(i*span/(n+1)));
    if(d>=due) d=shift(due,-1);
    if(d<=from) d=shift(from,1);
    if(out.indexOf(d)<0) out.push(d);
  }
  return out.map(function(d){ return { date:d, met:null }; });

/* drag to reorder */
var drag=null;
function gripDown(e,id){
  var row=e.target.closest(".sc-row"), list=$("#scList");
  if(!row||!list) return;
  e.preventDefault();
  drag={ el:row, list:list, startY:e.clientY };
  row.classList.add("dragging");
  document.addEventListener("pointermove",gripMove,{passive:false});
  document.addEventListener("pointerup",gripUp);
  document.addEventListener("pointercancel",gripUp);
}
function gripMove(e){
  if(!drag) return;
  e.preventDefault();
  var y=e.clientY;
  drag.el.style.transform="translateY("+(y-drag.startY)+"px)";
  var r=drag.el.getBoundingClientRect(), mid=r.top+r.height/2;
  var sibs=$$(".sc-row",drag.list).filter(function(z){ return z!==drag.el; });
  var target=null;
  for(var i=0;i<sibs.length;i++){
    var sr=sibs[i].getBoundingClientRect();
    if(mid<sr.top+sr.height/2){ target=sibs[i]; break; }
  }
  var moved=false;
  if(target){ if(drag.el.nextElementSibling!==target){ drag.list.insertBefore(drag.el,target); moved=true; } }
  else if(drag.list.lastElementChild!==drag.el){ drag.list.appendChild(drag.el); moved=true; }
  if(moved){ drag.startY=y; drag.el.style.transform=""; }
}
function gripUp(){
  if(!drag) return;
  drag.el.classList.remove("dragging");
  drag.el.style.transform="";
  var order=$$(".sc-row",drag.list).map(function(z){ return z.dataset.row; });
  var byId={}; S.scorecard.forEach(function(r){ byId[r.id]=r; });
  var next=[];
  order.forEach(function(id){ if(byId[id]){ next.push(byId[id]); delete byId[id]; } });
  Object.keys(byId).forEach(function(k){ next.push(byId[k]); });
  S.scorecard=next;
  document.removeEventListener("pointermove",gripMove);
  document.removeEventListener("pointerup",gripUp);
  document.removeEventListener("pointercancel",gripUp);
  drag=null;
  touch(); renderAll();
}
function promoteRow(rid){
  var row=S.scorecard.filter(function(r){ return r.id===rid; })[0];
  if(!row) return;
  var kind = row.rating==="-" ? "break" : "build";
  openEditor(null,kind,{ kind:kind, vals:{ name:row.text }, slots:[], metrics:[], fromRow:rid });
  $("#sheet").dataset.fromRow=rid;
}

/* ─────────── the fourteen-day start experiment ─────────── */
var EXP_DAYS=14;
function expWindow(){ return shift(today(),-(EXP_DAYS-1)); }
function expStats(){
  var f=focusLive(), from=expWindow(), d=today();
  var st=S.starts.filter(function(s){ return s.date>=from; });
  var dl=S.delays.filter(function(x){ return x.date>=from; });
  var lt=S.laterList.filter(function(l){ return l.date>=from; });
  /* the denominator is the days the current focus has actually been in play —
     a three-day-old focus is not graded out of fourteen */
  var since = (f && f.created>from) ? f.created : from;
  var planned = Math.max(1, daysBetween(since,d)+1);
  var dayset={};
  st.forEach(function(s){ dayset[s.date]=1; });
  var days=Object.keys(dayset).length, mins=0, onTime=0;
  st.forEach(function(s){ mins+=s.mins; if(s.onTime) onTime++; });
  var feelN={}, top=null;
  dl.forEach(function(x){
    x.feel.forEach(function(k){
      feelN[k]=(feelN[k]||0)+1;
      if(!top||feelN[k]>feelN[top]) top=k;
    });
  });
  var byType={};
  lt.forEach(function(l){ byType[l.type]=(byType[l.type]||0)+1; });
  var ckDue=0, ckMet=0, dlDue=0, dlMet=0;
  S.commitments.forEach(function(c){
    c.checks.forEach(function(k){ if(k.date<=d){ ckDue++; if(k.met===true) ckMet++; } });
    if(c.due<=d){ dlDue++; if(c.delivered) dlMet++; }
  });
  return { st:st, dl:dl, lt:lt, planned:planned, days:days, mins:mins, onTime:onTime,
    rate:Math.round(days/planned*100), per: st.length?Math.round(mins/st.length):0,
    top:top, feelN:feelN, byType:byType, ckDue:ckDue, ckMet:ckMet, dlDue:dlDue, dlMet:dlMet };
}

function drawStartChart(){
  var cv=$("#startchart"); if(!cv) return;
  var cs=getComputedStyle(document.documentElement), C=function(n){ return cs.getPropertyValue(n).trim(); };
  var ctx=cv.getContext("2d"), w=cv.width, hh=cv.height, pad={l:60,r:22,t:30,b:44};
  ctx.clearRect(0,0,w,hh);
  var days=[], i;
  for(i=EXP_DAYS-1;i>=0;i--) days.push(shift(today(),-i));
  var mins=days.map(function(d){
    var n=0; S.starts.forEach(function(s){ if(s.date===d) n+=s.mins; }); return n;
  });
  var early=days.map(function(d){
    return S.starts.some(function(s){ return s.date===d&&s.onTime; });
  });
  var mx=Math.max.apply(null,mins);
  if(!mx){
    ctx.fillStyle=C("--muted"); ctx.font="400 26px "+cUI(); ctx.textAlign="center";
    ctx.fillText(T("No starts logged in the last "+EXP_DAYS+" days","در ۱۴ روزِ گذشته شروعی ثبت نشده"),w/2,hh/2);
    return;
  }
  mx=mx*1.18;
  var X=function(k){ return pad.l+(k/(EXP_DAYS-1))*(w-pad.l-pad.r); };
  var Y=function(v){ return hh-pad.b-(v/mx)*(hh-pad.t-pad.b); };
  ctx.strokeStyle=C("--line"); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(pad.l,hh-pad.b); ctx.lineTo(w-pad.r,hh-pad.b); ctx.stroke();
  ctx.fillStyle=C("--muted"); ctx.font="400 21px "+cNum(); ctx.textAlign="right";
  [0,mx/2,mx].forEach(function(v){ ctx.fillText(N(Math.round(v)), pad.l-12, Y(v)+7); });
  ctx.textAlign="center";
  ctx.fillText(T(EXP_DAYS+" days ago","۱۴ روز پیش"), X(0)+44, hh-12);
  ctx.fillText(T("today","امروز"), X(EXP_DAYS-1)-16, hh-12);
  var bw=Math.max(10,(w-pad.l-pad.r)/EXP_DAYS*0.6);
  mins.forEach(function(v,k){
    if(!v) return;
    var top=Y(v), bh=(hh-pad.b)-top, bx=X(k)-bw/2, r=Math.min(7,bw/2);
    var g=ctx.createLinearGradient(0,top,0,hh-pad.b);
    /* an on-time start wears the app's green; a late one the cooler blue */
    g.addColorStop(0, early[k]?C("--green"):C("--turq"));
    g.addColorStop(1, early[k]?C("--green-deep"):C("--indigo"));
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(bx,top+bh); ctx.lineTo(bx,top+r);
    ctx.quadraticCurveTo(bx,top,bx+r,top);
    ctx.lineTo(bx+bw-r,top); ctx.quadraticCurveTo(bx+bw,top,bx+bw,top+r);
    ctx.lineTo(bx+bw,top+bh); ctx.closePath(); ctx.fill();
  });
}

/* 21-day chart per habit: bars for logged minutes, a line for a value measure */
function drawHabitCharts(){
  var cs=getComputedStyle(document.documentElement), C=function(n){ return cs.getPropertyValue(n).trim(); };
  $$("canvas.hchart").forEach(function(cv){
    var p=cv.dataset.hchart.split("|"), x=habit(p[0]); if(!x) return;
    var sel=null, list=chartables(x);
    for(var i=0;i<list.length;i++) if(list[i].key===p[1]) sel=list[i];
    if(!sel) return;
    var col=habCol(x), ctx=cv.getContext("2d"), w=cv.width, hh=cv.height;
    var pad={l:64,r:22,t:26,b:44};
    ctx.clearRect(0,0,w,hh);
    var DAYS=21, days=[];
    for(var k=DAYS-1;k>=0;k--) days.push(shift(today(),-k));

    var vals, target=null, isBar = sel.kind==="time";
    if(isBar){
      vals=days.map(function(d){ return minsOf(x.id,d); });
      target = x.minutesTarget||null;
    } else {
      /* carry the last reading forward so the line is continuous */
      var rs=readingsFor(x.id,sel.m.id), last=null, ri=0;
      vals=days.map(function(d){
        while(ri<rs.length && rs[ri].date<=d){ last=+rs[ri].value; ri++; }
        return last;
      });
      target = sel.m.target!=null ? +sel.m.target : null;
    }
    var have=vals.filter(function(v){ return v!==null&&v!==undefined&&!(isBar&&v===0); });
    if(!have.length){
      ctx.fillStyle=C("--muted"); ctx.font="400 26px "+cUI(); ctx.textAlign="center";
      ctx.fillText(isBar?T("No minutes logged in the last 21 days","در ۲۱ روزِ گذشته دقیقه‌ای ثبت نشده")
                        :T("No readings in the last 21 days","در ۲۱ روزِ گذشته عددی ثبت نشده"), w/2, hh/2);
      return;
    }
    var nums=have.slice(); if(target!=null) nums.push(target);
    var mx=Math.max.apply(null,nums), mn=Math.min.apply(null,nums);
    if(isBar){ mn=0; }
    if(mx===mn){ mx=mn+1; }
    var padr=(mx-mn)*0.18; mx+=padr; if(!isBar) mn-=padr;
    var X=function(i){ return pad.l+(i/(DAYS-1))*(w-pad.l-pad.r); };
    var Y=function(v){ return hh-pad.b-((v-mn)/(mx-mn))*(hh-pad.t-pad.b); };

    /* axis */
    ctx.strokeStyle=C("--line"); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pad.l,hh-pad.b); ctx.lineTo(w-pad.r,hh-pad.b); ctx.stroke();
    ctx.fillStyle=C("--muted"); ctx.font="400 21px "+cNum(); ctx.textAlign="right";
    [mn,(mn+mx)/2,mx].forEach(function(v){
      ctx.fillText(N(numFmt(Math.round(v*10)/10)), pad.l-12, Y(v)+7);
    });
    ctx.textAlign="center";
    ctx.fillText(T("21 days ago","۲۱ روز پیش"), X(0)+38, hh-12);
    ctx.fillText(T("today","امروز"), X(DAYS-1)-16, hh-12);

    /* target line */
    if(target!=null){
      ctx.setLineDash([9,8]); ctx.strokeStyle=C("--muted"); ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(pad.l,Y(target)); ctx.lineTo(w-pad.r,Y(target)); ctx.stroke();
      ctx.setLineDash([]);
    }

    if(isBar){
      var bw=Math.max(8,(w-pad.l-pad.r)/DAYS*0.62);
      vals.forEach(function(v,i){
        if(!v) return;
        var g=ctx.createLinearGradient(0,Y(v),0,hh-pad.b);
        g.addColorStop(0,col[1]); g.addColorStop(1,col[0]);
        ctx.fillStyle=g;
        var bh=(hh-pad.b)-Y(v);
        var bx=X(i)-bw/2, by=Y(v), r=Math.min(6,bw/2);
        ctx.beginPath();
        ctx.moveTo(bx,by+bh); ctx.lineTo(bx,by+r);
        ctx.quadraticCurveTo(bx,by,bx+r,by);
        ctx.lineTo(bx+bw-r,by); ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+r);
        ctx.lineTo(bx+bw,by+bh); ctx.closePath(); ctx.fill();
      });
    } else {
      var g2=ctx.createLinearGradient(pad.l,0,w-pad.r,0);
      g2.addColorStop(0,col[0]); g2.addColorStop(1,col[1]);
      ctx.strokeStyle=g2; ctx.lineWidth=7; ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.beginPath();
      var started=false;
      vals.forEach(function(v,i){
        if(v===null||v===undefined) return;
        if(!started){ ctx.moveTo(X(i),Y(v)); started=true; } else ctx.lineTo(X(i),Y(v));
      });
      ctx.stroke();
      /* mark the actual readings */
      var rs2=readingsFor(x.id,sel.m.id);
      rs2.forEach(function(r){
        var i2=days.indexOf(r.date);
        if(i2<0) return;
        ctx.fillStyle=C("--surface"); ctx.beginPath(); ctx.arc(X(i2),Y(+r.value),11,0,7); ctx.fill();
        ctx.fillStyle=col[0]; ctx.beginPath(); ctx.arc(X(i2),Y(+r.value),7,0,7); ctx.fill();
      });
    }
  });
}
function drawCurve(votes){

  ctx.strokeStyle=grad; ctx.lineWidth=9; ctx.lineJoin="round"; ctx.beginPath();

/* ─────────── calendar (.ics) ─────────── */
var BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsUnesc(s){ return String(s||"").replace(/\\n/gi,"\n").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\\\/g,"\\"); }
function stamp(){ return new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; }
function dtl(dateStr,timeStr){
  var t=String(timeStr||"09:00").split(":");
  return dateStr.replace(/-/g,"")+"T"+String(t[0]).padStart(2,"0")+String(t[1]||"00").padStart(2,"0")+"00";
}
function nextDateFor(days,from){
  for(var i=0;i<7;i++){ var d=shift(from,i); if(days.indexOf(dow(d))>-1) return d; }
  return from;
}
function buildICS(){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cast a Vote//Atomic Habits//EN","CALSCALE:GREGORIAN"];
  var start=today(), n=0;
  activeHabits().forEach(function(x){
    if(x.kind==="break") return;
    var desc=[];
    if(identText(x)) desc.push("Identity: "+identText(x));
    if(x.twoMin) desc.push("Two-minute version: "+x.twoMin);
    if(x.stackAfter) desc.push("After: "+x.stackAfter);
    if(x.reward) desc.push("Reward: "+x.reward);
    var body=icsEsc(desc.join("\n"));
    function ev(dtstart,rrule,dur,sfx){
      n++;
      L.push("BEGIN:VEVENT");
      L.push("UID:"+x.id+"-"+n+"@castavote");
      L.push("DTSTAMP:"+stamp());
      L.push("DTSTART:"+dtstart);
      L.push("DURATION:PT"+Math.max(1,dur)+"M");
      if(rrule) L.push("RRULE:"+rrule);
      L.push("SUMMARY:"+icsEsc(x.name+(sfx?" "+sfx:"")));
      if(body) L.push("DESCRIPTION:"+body);
      if(x.place) L.push("LOCATION:"+icsEsc(x.place));
      L.push("BEGIN:VALARM","TRIGGER:-PT5M","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(x.name),"END:VALARM");
      L.push("END:VEVENT");
    }
    if(x.mode==="habit"&&x.slots.length){
      x.slots.forEach(function(s){
        var d0=nextDateFor(s.days,start);
        var dur=s.dur|| (s.time&&s.end? Math.max(1,(+s.end.split(":")[0]*60+ +s.end.split(":")[1]) - (+s.time.split(":")[0]*60+ +s.time.split(":")[1])) : (x.minutesTarget||15));
        var rr="FREQ=WEEKLY;BYDAY="+s.days.map(function(i){ return BYDAY[i]; }).join(",");
        if(x.endDate) rr+=";UNTIL="+x.endDate.replace(/-/g,"")+"T235900";
        ev(dtl(d0,s.time||"09:00"), rr, dur, s.label||"");
      });
    } else if(x.mode==="task"&&x.taskMode==="every"){
      var map={minute:"MINUTELY",hour:"HOURLY",day:"DAILY",week:"WEEKLY"};
      var rr2="FREQ="+map[x.everyUnit]+";INTERVAL="+x.everyCount;
      if(x.endDate) rr2+=";UNTIL="+x.endDate.replace(/-/g,"")+"T235900";
      ev(dtl(start,"09:00"), rr2, x.minutesTarget||15, "");
    } else {
      var f={day:"DAILY",week:"WEEKLY",month:"MONTHLY",year:"YEARLY"}[x.perUnit]||"DAILY";
      var rr3="FREQ="+f;
      if(x.endDate) rr3+=";UNTIL="+x.endDate.replace(/-/g,"")+"T235900";
      ev(dtl(start,"09:00"), rr3, x.minutesTarget||15, x.perCount>1?"("+x.perCount+"×)":"");
    }
  });
  L.push("END:VCALENDAR");
  return { text:L.join("\r\n"), count:n };
}
function parseICS(text){
  var lines=String(text).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"").split("\n");
  var out=[], cur=null;
  lines.forEach(function(l){
    if(/^BEGIN:VEVENT/i.test(l)){ cur={}; return; }
    if(/^END:VEVENT/i.test(l)){ if(cur&&cur.summary) out.push(cur); cur=null; return; }
    if(!cur) return;
    var i=l.indexOf(":"); if(i<0) return;
    var key=l.slice(0,i).split(";")[0].toUpperCase(), val=l.slice(i+1);
    if(key==="SUMMARY") cur.summary=icsUnesc(val);
    else if(key==="DTSTART") cur.dtstart=val;
    else if(key==="RRULE") cur.rrule=val;
    else if(key==="LOCATION") cur.loc=icsUnesc(val);
    else if(key==="DESCRIPTION") cur.desc=icsUnesc(val);
  });
  return out.map(function(e){
    var t="", days=[0,1,2,3,4,5,6];
    var m=/T(\d{2})(\d{2})/.exec(e.dtstart||"");
    if(m) t=m[1]+":"+m[2];
    var by=/BYDAY=([^;]+)/i.exec(e.rrule||"");
    if(by) days=by[1].split(",").map(function(d){ return BYDAY.indexOf(d.replace(/^[-+]?\d/,"").toUpperCase()); })
      .filter(function(i){ return i>-1; });
    if(!days.length) days=[0,1,2,3,4,5,6];
    return { name:e.summary, time:t, days:days, loc:e.loc||"", desc:e.desc||"" };
  }).filter(function(e){ return e.name; });
}

function saveFile(name,text,mime){
  if(dl){
    dl.save({filename:name,data:text}).then(function(){ toast(T("Saved","ذخیره شد")); })
      .catch(function(e){ if(e&&e.code!=="declined") toast(T("Could not save the file","فایل ذخیره نشد")); });
    return;
  }
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:mime||"text/plain"}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600);
    toast(T("Saved","ذخیره شد"));
  }catch(e){ toast(T("Saving is unavailable here","اینجا امکانِ ذخیره نیست")); }
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.habits)) throw 0;
      S=migrate(o); touch(); applyLang(); applyTheme(); renderAll(); toast(T("Backup restored","پشتیبان برگشت"));
    }catch(e){ toast(T("That file is not a valid backup","این فایل پشتیبانِ معتبری نیست")); }
  };
  r.onerror=function(){ toast(T("Could not read that file","این فایل خوانده نشد")); };
  r.readAsText(file);
}
function importIcs(file){
  var r=new FileReader();
  r.onload=function(){
    try{ openIcsImport(parseICS(r.result)); }
    catch(e){ toast(T("Could not read that calendar","این تقویم خوانده نشد")); }
  };
  r.onerror=function(){ toast(T("Could not read that file","این فایل خوانده نشد")); };
  r.readAsText(file);
}

/* ─────────── render ─────────── */
function renderAll(){
  if(view==="today") renderToday();
  else if(view==="start") renderStart();
  else if(view==="habits") renderHabits();
  else if(view==="card") renderCard();
  else if(view==="progress") renderProgress();
  else if(view==="guide") renderGuide();
  else if(view==="settings") renderSettings();
  if(S.timer) startTick(); else clearInterval(tmrTick);
}

/* ─────────── events ─────────── */
document.addEventListener("pointerdown",function(e){
  var g=e.target.closest("[data-grip]");
  if(g) gripDown(e,g.dataset.grip);
});
document.addEventListener("click",function(e){
  var cell=e.target.closest("[data-day]");
  if(cell&&cell.tagName==="I"){ var p=cell.dataset.day.split("|"); return openDay(p[0],p[1]); }
  var t=e.target.closest("button"); if(!t) return;
  var d=t.dataset;

  if(d.go) return go(d.go);
  if(d.close) return closeSheet();
  if(d.new) return openEditor(null,null,null);
  if(d.edit) return openEditor(d.edit);
  if(d.cog) return openCog(d.cog);
  if(d.meas) return openMeasures(d.meas);
  if(d.quickread) return openQuickRead(d.quickread);
  if(d.urge) return openUrge(d.urge);
  if(d.editurge){ var eu=d.editurge.split("|"); return openUrge(eu[0],eu[1]); }
  if(d.saveurge) return saveUrge(d.saveurge);
  if(d.delurge){
    S.urges=S.urges.filter(function(u){ return u.id!==d.delurge; });
    touch(); closeSheet(); renderAll(); toast(T("Urge deleted","وسوسه حذف شد")); return;
  }
  if(d.timer) return openTimer(d.timer);
  if(t.hasAttribute("data-save")) return saveEditor(d.save);
  if(d.export) return saveFile("atomic-habits-"+today()+".json", JSON.stringify(S,null,2), "application/json");
  if(d.import) return $("#importFile").click();
  if(d.icsout){
    var r=buildICS();
    if(!r.count){ toast(T("No scheduled habits to export yet","فعلاً عادتِ زمان‌بندی‌شده‌ای برای خروجی نیست")); return; }
    saveFile("cast-a-vote-"+today()+".ics", r.text, "text/calendar");
    return;
  }
  if(d.icsin) return $("#icsFile").click();
  if(d.icsadd){
    var added=0;
    $$("[data-pick]").forEach(function(cb){
      if(!cb.checked) return;
      var e2=icsPending[+cb.dataset.pick]; if(!e2) return;
      var nh=normHabit({ id:uid(), kind:"build", name:e2.name, mode:"habit", created:today(),
        slots:[{days:e2.days.slice(), time:e2.time||""}], place:e2.loc||"", envCue:"",
        identity:"", gainPct:1, metrics:[] });
      S.habits.push(nh); added++;
    });
    touch(); closeSheet(); renderAll();
    toast(added? T(added+" habit"+(added===1?"":"s")+" added", added+" عادت اضافه شد") : T("Nothing selected","چیزی انتخاب نشده"));
    return;
  }
  if(d.setday){
    var sp=d.setday.split("|");
    setStatus(sp[0],sp[1], sp[2]==="clear"?null:sp[2]);
    closeSheet(); renderAll(); return;
  }
  if(d.dropdraft){ S.draft=null; persist(); closeSheet(); openEditor(null,null,null); return; }
  if(d.resetfade){
    S.habits.forEach(function(x){ x.showDetails=null; });
    touch(); renderAll(); toast(T("Cards back to automatic","کارت‌ها برگشتند به حالتِ خودکار")); return;
  }
  if(d.reset){
    askConfirm(T("Erase everything?","همه‌چیز پاک شود؟"),
      T("All "+S.habits.length+" habit"+(S.habits.length===1?"":"s")+", "+totalVotes()
        + " votes, every scorecard row, measure and urge. This cannot be undone &mdash; export a backup first if you might want it.",
        "هر "+S.habits.length+" عادت، "+totalVotes()
        + " رأی، و هر سطرِ کارنامه و اندازه و وسوسه. برگشتی در کار نیست &mdash; اگر شاید بعداً بخواهی‌شان، اول پشتیبان بگیر."),
      T("Erase all data","پاک کردنِ همهٔ داده‌ها"), function(){
        var keep={theme:S.settings.theme, lang:S.settings.lang};
        S=blank(); S.settings=keep;          /* wiping data must not flip the app's language */
        touch(); applyLang(); applyTheme(); go("today"); toast(T("Cleared","پاک شد"));
      });
    return;
  }
  if(d.theme){ S.settings.theme=d.theme; touch(); applyTheme(); renderAll(); return; }
  if(d.skin){
    if(S.settings.skin!==d.skin){
      S.settings.skin=d.skin; touch(); applyLang(); installManifest(); renderAll();
    }
    return;
  }
  if(d.lang){
    if(S.settings.lang!==d.lang){
      S.settings.lang=d.lang; touch(); applyLang(); installManifest(); renderTabs(); renderAll();
      toast(T("Switched to English","به فارسی سوئیچ شد"));
    }
    return;
  }
  if(d.hintsc!==undefined){
    S.settings.hintScaffold = d.hintsc==="1";
    touch(); renderAll();
    toast(S.settings.hintScaffold? T("Guidance fades again","متن‌های راهنما دوباره محو می‌شوند")
                                 : T("Guidance stays on every screen","متن‌های راهنما همه‌جا می‌مانند"));
    return;
  }
  if(d.scaffold!==undefined){
    S.settings.scaffold = d.scaffold==="1";
    touch(); renderAll();
    toast(S.settings.scaffold? T("Scaffolding fades again","جزییات موقت دوباره محو می‌شوند")
                             : T("Every tactic stays on every card","همهٔ تاکتیک‌ها روی همهٔ کارت‌ها می‌مانند"));
    return;
  }

  /* editor controls that re-render the sheet */
  if(d.kind||d.mode||d.tmode!==undefined||d.tmren!==undefined){
    if(t.getAttribute("aria-pressed")==="true") return;
    var sh=$("#sheet"), sb=sh.querySelector("[data-save]"), fr=sh.dataset.fromRow;
    var carry=readEditor();
    if(d.kind) carry.kind=d.kind;
    if(d.mode) carry.vals.mode=d.mode;
    if(d.tmode) carry.vals.taskMode=d.tmode;
    if(d.tmren!==undefined) carry.vals.useTimer=d.tmren;
    openEditor(sb&&sb.dataset.save?sb.dataset.save:null, carry.kind, carry);
    if(fr) $("#sheet").dataset.fromRow=fr;
    return;
  }
  if(d.identadd||d.identpick||d.identdel){
    var shi=$("#sheet"), sbi=shi.querySelector("[data-save]"), fri=shi.dataset.fromRow;
    var ci=readEditor();
    if(d.identadd){
      var inp2=$("#f-newident"), tx=inp2?inp2.value.trim():"";
      if(!tx){ if(inp2) inp2.focus(); return; }
      var o2=ensureIdentity(tx);
      if(o2&&edIdents.indexOf(o2.id)<0) edIdents.push(o2.id);
      touch();
    }
    if(d.identpick && edIdents.indexOf(d.identpick)<0) edIdents.push(d.identpick);
    if(d.identdel){
      var ix2=edIdents.indexOf(d.identdel);
      if(ix2>-1) edIdents.splice(ix2,1);
    }
    ci.idents=edIdents.slice();
    openEditor(sbi&&sbi.dataset.save?sbi.dataset.save:null, ci.kind, ci);
    if(fri) $("#sheet").dataset.fromRow=fri;
    return;
  }
  if(d.tchart){ var hc1=habit(d.tchart); if(hc1){ hc1.showChart=(hc1.showChart===false); touch(); renderAll(); } return; }
  if(d.tchain){ var hc2=habit(d.tchain); if(hc2){ hc2.showChain=(hc2.showChain===false); touch(); renderAll(); } return; }
  if(d.tguide){
    if(!S.settings.guideClosed) S.settings.guideClosed={};
    S.settings.guideClosed[d.tguide]=!S.settings.guideClosed[d.tguide];
    touch(); renderAll(); return;
  }
  if(d.acc){
    var sha=$("#sheet"), sba=sha.querySelector("[data-save]"), fra=sha.dataset.fromRow;
    var ca=readEditor();
    edOpen[d.acc]=!edOpen[d.acc];
    ca.open=edOpen;
    openEditor(sba&&sba.dataset.save?sba.dataset.save:null, ca.kind, ca);
    if(fra) $("#sheet").dataset.fromRow=fra;
    return;
  }
  if(d.chartsel){
    var csx=d.chartsel.split("|"), hcx=habit(csx[0]);
    if(hcx){ hcx.chartMetric=csx[1]; touch(); renderAll(); }
    return;
  }
  if(d.picon||d.pcol){
    var shx=$("#sheet"), sbx=shx.querySelector("[data-save]"), frx=shx.dataset.fromRow;
    var cx=readEditor();
    if(d.picon) cx.vals.icon=d.picon;
    if(d.pcol) cx.vals.color=d.pcol;
    openEditor(sbx&&sbx.dataset.save?sbx.dataset.save:null, cx.kind, cx);
    if(frx) $("#sheet").dataset.fromRow=frx;
    return;
  }
  if(d.sday!==undefined){
    var q=d.sday.split("|"), si=+q[0], di=+q[1];
    syncSlots();
    if(edSlots[si]){
      var ix=edSlots[si].days.indexOf(di);
      if(ix>-1) edSlots[si].days.splice(ix,1); else edSlots[si].days.push(di);
      edSlots[si].days.sort();
      if(!edSlots[si].days.length) edSlots[si].days=[0,1,2,3,4,5,6];
    }
    setHTML($("#slotsBox"),slotsHTML()); saveDraft(); return;
  }
  if(d.slotadd!==undefined){ syncSlots(); edSlots.push(normSlot({})); setHTML($("#slotsBox"),slotsHTML()); return; }
  if(d.slotdel!==undefined){ syncSlots(); edSlots.splice(+d.slotdel,1); setHTML($("#slotsBox"),slotsHTML()); return; }
  if(d.metadd!==undefined){ syncMetrics(); edMetrics.push({label:"",unit:"",start:"",target:"",active:true}); setHTML($("#metBox"),metricsHTML()); return; }
  if(d.metdel!==undefined){ syncMetrics(); edMetrics.splice(+d.metdel,1); setHTML($("#metBox"),metricsHTML()); return; }
  if(d.out){ $$("[data-out]").forEach(function(b){ b.setAttribute("aria-pressed", b===t?"true":"false"); }); return; }

  if(d.addread){
    var pr2=d.addread.split("|"), inp=$("#rd-"+pr2[1]);
    var val=inp?inp.value.trim():"";
    if(val===""||isNaN(+val)){ toast(T("Enter a number","یک عدد وارد کن")); if(inp) inp.focus(); return; }
    S.readings.push({ id:uid(), habitId:pr2[0], metricId:pr2[1], date:today(), t:Date.now(), value:+val });
    touch(); closeSheet(); renderAll(); toast(T("Reading logged","عدد ثبت شد")); return;
  }
  if(d.readall){
    var n2=0;
    $$("[data-read]").forEach(function(el){
      var v=el.value.trim();
      if(v===""||isNaN(+v)) return;
      S.readings.push({ id:uid(), habitId:d.readall, metricId:el.dataset.read, date:today(), t:Date.now(), value:+v });
      n2++;
    });
    if(!n2){ toast(T("Enter at least one number","حداقل یک عدد وارد کن")); return; }
    touch(); closeSheet(); renderAll();
    toast(T(n2+" reading"+(n2===1?"":"s")+" logged", n2+" عدد ثبت شد")); return;
  }
  if(d.rdedit){ var re=d.rdedit.split("|"); return openReading(re[0],null,re[1]); }
  if(d.rdnew){ var rn=d.rdnew.split("|"); return openReading(rn[0],rn[1],null); }
  if(d.rdsave){
    var rp=d.rdsave.split("|"), rhid=rp[0], rmid=rp[1], rrid=rp[2];
    var v=$("#rv").value.trim(), dt=$("#rdate").value, tm2=$("#rtime").value||"12:00";
    if(v===""||isNaN(+v)){ toast(T("Enter a number","یک عدد وارد کن")); $("#rv").focus(); return; }
    if(!dt){ toast(T("Pick a date","یک تاریخ انتخاب کن")); return; }
    if(dt>today()){ toast(T("That date is in the future","این تاریخ برای آینده است")); return; }
    var parts=tm2.split(":");
    var stampMs=fromISO(dt).setHours(+parts[0]||0,+parts[1]||0,0,0);
    if(rrid){
      S.readings.forEach(function(z){
        if(z.id===rrid){ z.value=+v; z.date=dt; z.t=stampMs; }
      });
    } else {
      S.readings.push({ id:uid(), habitId:rhid, metricId:rmid, date:dt, t:stampMs, value:+v });
    }
    touch(); openMeasures(rhid); renderAll();
    toast(rrid?T("Reading updated","عدد به‌روز شد"):T("Reading added","عدد اضافه شد"));
    return;
  }
  if(d.rddel){
    var rr=S.readings.filter(function(z){ return z.id===d.rddel; })[0];
    var rhid2=rr?rr.habitId:null;
    S.readings=S.readings.filter(function(z){ return z.id!==d.rddel; });
    touch();
    if(rhid2) openMeasures(rhid2); else closeSheet();
    renderAll(); toast(T("Reading deleted","عدد حذف شد"));
    return;
  }
  if(d.metactive){
    var pa=d.metactive.split("|"), hx=habit(pa[0]);
    if(hx) hx.metrics.forEach(function(m){ if(m.id===pa[1]) m.active=!m.active; });
    touch(); openMeasures(pa[0]); renderAll(); return;
  }

  if(d.tmr){
    var tm=S.timer; if(!tm) return;
    if(d.tmr==="toggle"){
      if(tm.running){ tm.accumulated=timerElapsed(); tm.running=false; }
      else { tm.startedAt=Date.now(); tm.running=true; }
      touch(); openTimer(tm.habitId); renderAll(); return;
    }
    if(d.tmr==="reset"){ tm.accumulated=0; tm.startedAt=Date.now(); touch(); openTimer(tm.habitId); renderAll(); return; }
    if(d.tmr==="drop"){ S.timer=null; touch(); closeSheet(); renderAll(); return; }
    if(timerElapsed()<MIN_LOG_MS && (d.tmr==="part"||d.tmr==="log")){
      toast(T("Two minutes is the floor","کفِ ماجرا دو دقیقه است")); return;
    }
    if(d.tmr==="part"){
      var ps=Math.round(timerElapsed()/1000), phid=tm.habitId, ph=habit(phid);
      var ptot=secsOf(phid,today())+ps;
      writeEntry(phid,today(),{secs:ptot,mins:undefined});
      if(tm.focus) recordStart(ps/60,"stopped"); else if(tm.startRef) bumpStart(tm.startRef,ps/60);
      S.timer=null; touch(); closeSheet(); renderAll();
      toast(T(fmtMS(ps)+" logged", fmtMS(ps)+" ثبت شد")
        + (ph&&ph.minutesTarget? " · "+T(fmtDur(leftSecs(ph,today()))+" left", fmtDur(leftSecs(ph,today()))+" مانده"):""));
      return;
    }
    if(d.tmr==="log"){
      var ls=Math.round(timerElapsed()/1000), hid2=tm.habitId, hx2=habit(hid2);
      var total=secsOf(hid2,today())+ls;
      writeEntry(hid2,today(),{secs:total,mins:undefined});
      if(tm.focus) recordStart(ls/60,"stopped"); else if(tm.startRef) bumpStart(tm.startRef,ls/60);
      setStatus(hid2,today(),"done");
      S.timer=null; touch(); closeSheet(); renderAll();
      toast(T(fmtMS(ls)+" logged · complete", fmtMS(ls)+" ثبت شد · تمام")); return;
    }
  }
  if(d.tmrmode){ if(S.timer){ S.timer.mode=d.tmrmode; touch(); openTimer(S.timer.habitId); } return; }

  /* ── start module ── */
  if(d.stpick){
    if(d.stpick==="open") return openFocusPick();
    setFocusHabit(d.stpick); closeSheet(); go("start"); openIntention(); return;
  }
  if(d.stnew){ focusWanted=true; closeSheet(); openEditor(null,"build",null); return; }
  if(d.stdrop){
    S.focus=null; touch(); closeSheet(); renderAll();
    toast(T("Table cleared","میز خالی شد")); return;
  }
  if(d.stint) return openIntention();
  if(d.stsave) return saveIntention();
  if(d.stgo) return startFocus();
  if(d.stafter) return afterStart(d.stafter);
  if(d.stlater) return openLater();
  if(d.stlsave) return saveLater();
  if(d.stltype){
    $$("[data-stltype]",$("#sheet")).forEach(function(b){
      b.setAttribute("aria-pressed", b===t ? "true" : "false"); });
    return;
  }
  /* the feelings are a multi-select: more than one can be true at once */
  if(d.stfeel){ t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")==="true"?"false":"true"); return; }
  if(d.stcurio) return openCuriosity();
  if(d.stldone){
    S.laterList.forEach(function(l){
      if(l.id===d.stldone){ l.done=!l.done; l.doneAt=l.done?today():null; } });
    touch(); renderAll();
    if($("#veil").classList.contains("on")) openCuriosity();
    return;
  }
  if(d.stldel){
    S.laterList=S.laterList.filter(function(l){ return l.id!==d.stldel; });
    touch(); renderAll(); openCuriosity(); return;
  }
  if(d.stlclear){
    S.laterList=S.laterList.filter(function(l){ return !l.done; });
    touch(); renderAll(); openCuriosity();
    toast(T("Cleared","پاک شد")); return;
  }
  if(d.stdelay) return openDelay();
  if(d.stdsave) return saveDelay();
  if(d.stcommit) return openCommit();
  if(d.stcsave) return saveCommit();
  if(d.stcmet){
    var cq=d.stcmet.split("|"), cid=cq[0], cix=+cq[1];
    S.commitments.forEach(function(c){
      if(c.id===cid&&c.checks[cix]) c.checks[cix].met = c.checks[cix].met===true ? null : true;
    });
    touch(); renderAll(); return;
  }
  if(d.stset){
    var fg=$("#f-fg");
    S.settings.forgiveText = fg ? fg.value.trim() : "";
    touch(); renderAll(); toast(T("Saved","ذخیره شد")); return;
  }
  if(d.stfgreset){
    S.settings.forgiveText=""; touch(); renderAll();
    toast(T("Back to the default sentence","جملهٔ پیش‌فرض برگشت")); return;
  }
  if(d.stcheck){
    S.settings.delayCheck = d.stcheck==="1";
    touch(); renderAll();
    toast(S.settings.delayCheck ? T("The app will ask","از این به بعد می‌پرسد")
                                : T("The app will stay quiet","دیگر چیزی نمی‌پرسد")); return;
  }
  if(d.stdeliver){
    S.commitments.forEach(function(c){ if(c.id===d.stdeliver) c.delivered=!c.delivered; });
    touch(); renderAll();
    toast(T("Noted","ثبت شد")); return;
  }
  if(d.stcdrop){
    var ff=focusLive();
    S.commitments=S.commitments.filter(function(c){ return c.id!==d.stcdrop; });
    if(ff&&ff.commitId===d.stcdrop) ff.commitId=null;
    touch(); renderAll(); toast(T("Deadline removed","مهلت برداشته شد")); return;
  }

  if(d.cycle){
    var was=statusOf(d.cycle,today());
    bump(d.cycle,today());
    renderAll();
    var now=statusOf(d.cycle,today());
    if(GOOD[now]&&now!==was){
      var hb=habit(d.cycle), idt=hb?identText(hb):"";
      toast(idt? T("Vote cast · "+idt, "رأی ثبت شد · "+idt) : T("Vote cast","رأی ثبت شد"));
    }
    return;
  }
  if(d.det){ var hd=habit(d.det); if(hd){ hd.showDetails=!detailsOpen(hd); touch(); renderAll(); } return; }
  if(d.arch){ var hr=habit(d.arch); if(hr){ hr.archived=!hr.archived; touch(); closeSheet(); renderAll(); } return; }
  if(d.del){
    var hz=habit(d.del); if(!hz) return;
    var did=d.del;
    askConfirm(T("Delete this habit?","این عادت حذف شود؟"),
      T("<strong>"+esc(hz.name)+"</strong> and its whole history go: "+keptCount(hz)+" kept day"
        + (keptCount(hz)===1?"":"s")+", every measure reading and every urge logged against it. This cannot be undone.",
        "<strong>"+esc(hz.name)+"</strong> با تمامِ تاریخچه‌اش می‌رود: "+keptCount(hz)
        + " روزِ نگه‌داشته، هر عددی که برایش ثبت کرده‌ای و هر وسوسه‌ای که پایش نوشته‌ای. برگشتی در کار نیست."),
      T("Delete habit","حذف عادت"), function(){
        S.habits=S.habits.filter(function(z){ return z.id!==did; });
        delete S.logs[did];
        S.urges=S.urges.filter(function(u){ return u.habitId!==did; });
        S.readings=S.readings.filter(function(r){ return r.habitId!==did; });
        S.scorecard=S.scorecard.filter(function(r){ return r.habitId!==did; });
        if(S.timer&&S.timer.habitId===did) S.timer=null;
        touch(); renderAll(); toast(T("Deleted","حذف شد"));
      });
    return;
  }
  if(d.confirmyes){
    var fn=pendingConfirm; pendingConfirm=null; closeSheet();
    if(fn) fn();
    return;
  }

  if(d.scadd){
    var i3=$("#scNew"), v3=i3.value.trim();
    if(!v3){ i3.focus(); return; }
    S.scorecard.push({ id:uid(), kind:"manual", text:v3, rating:null });
    touch(); renderAll();
    var f3=$("#scNew"); if(f3) f3.focus();
    return;
  }
  if(d.cyc){
    S.scorecard.forEach(function(r){
      if(r.id===d.cyc) r.rating=RATE_CYCLE[(RATE_CYCLE.indexOf(r.rating)+1)%RATE_CYCLE.length];
    });
    touch(); renderAll(); return;
  }
  if(d.promote) return promoteRow(d.promote);
  if(d.scdel){ S.scorecard=S.scorecard.filter(function(r){ return r.id!==d.scdel; }); touch(); renderAll(); return; }
});

    var je=document.getElementById("je-"+e.target.id);
    if(je&&e.target.value) setText(je, fullJalali(e.target.value));
  }

  clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,450);
});

  if(e.target.closest("#sheet")&&e.target.tagName==="SELECT"){
    var sh=$("#sheet"), sb=sh.querySelector("[data-save]"), fr=sh.dataset.fromRow;
    var carry=readEditor();
    openEditor(sb&&sb.dataset.save?sb.dataset.save:null, carry.kind, carry);
    if(fr) $("#sheet").dataset.fromRow=fr;
  }
});

    e.preventDefault();

  else if(rolled) renderAll();
  /* an installed app comes back from the background rather than reloading */
  if(delayDue()&&!$("#veil").classList.contains("on")) setTimeout(openDelay,500);
});

/* ─────────── installable ───────────
   Served as a folder over https, the manifest files and the service worker turn
   this into a real installed app: its own icon, no browser bars, and it opens
   with the network off. There are four manifests because the name on the home
   screen follows the language and the icon follows the skin — whichever pair
   you are on when you install is the pair you get.

   A loose file, or the artifact frame, can do none of that: there is no origin
   to register a worker against and no manifest to fetch. So nothing is written
   into the page at all, and the icon rides along as a data URI instead. */
function deployed(){
  if(window.top!==window.self) return false;
  return location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
}
function installManifest(){
  try{
    var sk = SKIN==="fa" ? "persian" : "modern";
    var f=document.getElementById("fav");
    if(f) f.href=FAVICON[sk];
    var t=document.getElementById("atitle");
    if(t) t.setAttribute("content", T("Cast a Vote","یک رأی بینداز"));
    if(!deployed()) return;
    var l=document.getElementById("mf");
    if(!l){ l=document.createElement("link"); l.rel="manifest"; l.id="mf"; document.head.appendChild(l); }
    l.href="manifest."+LANG+"-"+sk+".webmanifest";
    var a=document.getElementById("ati");
    if(!a){ a=document.createElement("link"); a.rel="apple-touch-icon"; a.id="ati"; document.head.appendChild(a); }
    a.href="apple-touch-icon-"+sk+".png";
  }catch(e){}
}
function registerSW(){
  try{
    if(!deployed() || !("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }catch(e){}
}

/* boot */
S=loadLocal();
if(pruneIdentities()) persist();
applyLang();
applyTheme();
installManifest();
registerSW();
renderTabs();
renderAll();
initCloud();
/* the planned hour went by with nothing logged: ask, gently, at most once a day */
if(delayDue()) setTimeout(openDelay,800);

})();
